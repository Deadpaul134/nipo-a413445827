  ((hasEp(a) ? +a.episode : Infinity) - (hasEp(b) ? +b.episode : Infinity)) ||
  String(a.createdAt || "").localeCompare(String(b.createdAt || ""));
const openTasks = () => tasks.filter(t => (t.status || "open") === "open").sort(taskOrder);
const lingering = t => t.status === "done" && taskLinger.has(t.id);
// What the open lists show: open tasks plus ones ticked a moment ago. Counts use openTasks().
const listedTasks = () => tasks.filter(t => (t.status || "open") === "open" || lingering(t)).sort(taskOrder);
const recentDoneTasks = () => tasks
  .filter(t => t.status === "done" && !lingering(t) && t.doneAt && Date.now() - new Date(t.doneAt) <= DONE_SHOWN_MS)
  .sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt)));
const epTasks = id => openTasks().filter(t => hasEp(t) && String(t.episode) === id);
const epListedTasks = id => listedTasks().filter(t => hasEp(t) && String(t.episode) === id);
// When each task's last write landed, so "saved" stays readable before the task moves.
const taskSavedAt = new Map();
const SAVED_SEEN_MS = 1500;
function lingerTask(id) {
  clearTimeout(taskLinger.get(id));
  taskLinger.set(id, setTimeout(function done() {
    // Keep it in place while its write is still in flight, and a moment after it lands.
    if (taskBusy.has(id) || Date.now() - (taskSavedAt.get(id) || 0) < SAVED_SEEN_MS) {
      taskLinger.set(id, setTimeout(done, 300)); return;
    }
    taskLinger.delete(id);
    renderTaskViews();
  }, TASK_LINGER_MS));
}
function unlingerTask(id) {
  clearTimeout(taskLinger.get(id));
  taskLinger.delete(id);
}
const waitsForYou = e => isYours(e) || epApprovals(e.id).length > 0 || epTasks(e.id).length > 0;
// Closest to going live first; ties go to the earlier episode.
const byClosest = (a, b) => stationIndex[stageOf(b)] - stationIndex[stageOf(a)] || +a.id - +b.id;

// Re-rendering on live updates must not eat what the user is typing.
function paint(el, html) {
  const kept = {};
  el.querySelectorAll("textarea, input[type=text]").forEach(i => { if (i.id) kept[i.id] = i.value; });
  const focused = el.contains(document.activeElement) ? document.activeElement.id : null;
  const openDetails = [...el.querySelectorAll("details[id]")].filter(d => d.open).map(d => d.id);
  el.innerHTML = html;
  Object.entries(kept).forEach(([id, v]) => { const i = document.getElementById(id); if (i) i.value = v; });
  openDetails.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
  fitClamps(el);
  if (focused) document.getElementById(focused)?.focus();
}
/* Text cut after three lines gets "קרא עוד" / "הסתר", only when it is really cut.
   Which ones are open is kept across redraws, by key. */
const expanded = new Set();
function clampText(key, html, cls = "", tag = "p") {
  const open = expanded.has(key);
  return `<${tag} class="${cls}${open ? "" : " clamp"}" id="clamp-${esc(key)}" data-clamp="${esc(key)}">${html}</${tag}>
    <button class="linkbtn more" type="button" data-more="${esc(key)}" aria-controls="clamp-${esc(key)}" aria-expanded="${open}" hidden>${open ? "הסתר" : "קרא עוד"}</button>`;
}
function fitClamps(root = document) {
  root.querySelectorAll("[data-clamp]").forEach(el => {
    const btn = el.nextElementSibling;
    if (!btn || !btn.matches("[data-more]")) return;
    btn.hidden = expanded.has(el.dataset.clamp) ? false : !(el.scrollHeight > el.clientHeight + 1);
  });
}
function toggleClamp(btn) {
  const key = btn.dataset.more, el = document.getElementById("clamp-" + key);
  if (!el) return;
  const open = !expanded.has(key);
  if (open) expanded.add(key); else expanded.delete(key);
  el.classList.toggle("clamp", !open);
  btn.textContent = open ? "הסתר" : "קרא עוד";
  btn.setAttribute("aria-expanded", String(open));
  fitClamps(el.parentElement);
}

function approvalCard(a, where) {
  const ep = a.episode != null && epById[String(a.episode)] ? epById[String(a.episode)] : null;
  const key = `appr-${a.id}`;
  const nk = `${where}-${a.id}`;
  const ro = canWrite() ? "" : "disabled";
  return `<div class="wcard appr">${isNew("appr", a.id) ? NEW_DOT : ""}
    <span class="kind">${mark(a.from, 16)}לאישור · מ${esc(nameOf(a.from))}${ep && where !== "sheet" ? ` · ${esc(epLabel(ep))}` : ""}${isGrok(a.from) ? GROK_CHIP : ""}</span>
    <span class="title">${esc(a.title)}</span>
    ${a.detail ? clampText(`appr-${where}-${a.id}`, esc(a.detail), "detail") : ""}
    <div class="quick-appr" data-actions>
      <button class="btn primary" data-decide="approved" data-id="${esc(a.id)}" data-where="${where}" ${ro}>אשר</button>
      <button class="btn no" data-decide="rejected" data-id="${esc(a.id)}" data-where="${where}" ${ro}>דחה</button>
      ${noteOpen.has(nk) ? "" : `<button class="linkbtn note-link" type="button" data-note-open="${esc(nk)}">להוסיף הערה</button>`}
      ${btnNote(key)}
    </div>
    ${noteOpen.has(nk) ? `<input type="text" class="note-in" id="note-in-${esc(nk)}" placeholder="הערה, לא חובה" aria-label="הערה">` : ""}
  </div>`;
}

function yourTaskItem(t, where) {
  const done = t.status === "done";
  const ro = !canWrite() || taskBusy.has(t.id);
  const urgent = t.blocking && !done;
  const tags = [
    hasEp(t) && where !== "sheet" ? `<span class="tag epno">פרק ${bd(t.episode)}</span>` : "",
    TASK_SOURCE[t.source] ? `<span class="tag src">${esc(TASK_SOURCE[t.source])}</span>` : "",
    done && t.doneAt ? `<span class="meta">סומן ${bd(fmtDate(t.doneAt))}</span>` : "",
  ].filter(Boolean).join("");
  return `<li class="${urgent ? "ytask-blocking" : ""}"><label class="ytask">
    <input type="checkbox" data-task="${esc(t.id)}" ${done ? "checked" : ""} ${ro ? "disabled" : ""}
      aria-label="${urgent ? "דחוף, עוצר פרק: " : ""}${esc(t.text)}${done ? ", בוצע" : ""}">
    <span class="box">${CHECK}</span>
    <span class="ytask-body">
      ${urgent ? `<span class="urgent" title="המשימה עוצרת פרק">דחוף</span>` : ""}
      <span class="ytask-text">${txt(t.text)}</span>
      ${t.note ? `<span class="ytask-note">${txt(t.note)}</span>` : ""}
      ${tags ? `<span class="ytask-tags">${tags}</span>` : ""}
      ${btnNote("task-" + t.id)}
    </span>
  </label></li>`;
}
function yourTasks() {
  const open = openTasks();
  const listed = listedTasks().filter(matches);
  const done = recentDoneTasks().filter(matches);
  const hot = open.some(t => t.blocking);
  const body = !loaded.tasks ? `<p class="empty">${loadFailed ? "המשימות לא נטענו. העמוד ינסה שוב בעוד דקה." : "טוען…"}</p>`
    : listed.length ? `<ul class="ytask-list">${listed.map(t => yourTaskItem(t, "list")).join("")}</ul>`
    : query ? (done.length ? "" : `<p class="search-empty">לא נמצאו משימות שמתאימות לחיפוש.</p>`)
    : `<p class="empty">אין משימות פתוחות.</p>`;
  const countText = !loaded.tasks ? "" : query ? `${listed.length} מתוך ${open.length}` : `${open.length} פתוחות`;
  // While searching, finished matches show opened, so nothing found is hidden.
  return `<section class="card ytasks${hot ? " hot" : ""}" id="tasks" aria-labelledby="h-ytasks">
    <div class="ytasks-head"><span class="ring" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8L16.3 9.5"/></svg></span>
      <h3 id="h-ytasks">המשימות שלך</h3>
      ${countText ? `<span class="count">${txt(countText)}</span>` : ""}
      <span class="hint">מה שרק אתה יכול לעשות. וי כאן מגיע לכל מי שביקש.</span></div>
    ${body}
    ${done.length ? `<details class="fold ytask-done" id="fold-tasks-done" ${query ? "open" : ""}><summary>הושלם בשבוע האחרון (${bd(done.length)})</summary>
      <ul class="ytask-list">${done.map(t => yourTaskItem(t, "list")).join("")}</ul></details>` : ""}
  </section>`;
}

// quiet: no undo bar (the undo itself, for one). Resolves true when the write landed.
async function setTaskDone(id, done, quiet) {
  if (!canWrite() || taskBusy.has(id)) return false;
  let ok = false;
  const key = "task-" + id;
  const i = tasks.findIndex(x => x.id === id);
  const before = i >= 0 ? tasks[i] : null;
  // Ticking an open task keeps it in place for a moment; unticking during that moment
  // cancels the wait and reopens it, like any untick.
  if (done && before && (before.status || "open") === "open") lingerTask(id); else unlingerTask(id);
  taskBusy.add(id);
  noteSaving(key);
  // Show the change at once; the live snapshot confirms it.
  if (before) {
    const next = { ...before, status: done ? "done" : "open" };
    if (done) { next.doneAt = new Date().toISOString(); next.doneBy = "user"; } else { delete next.doneAt; delete next.doneBy; }
    tasks = tasks.map(x => (x.id === id ? next : x));
  }
  renderTaskViews();
  try {
    const at = new Date().toISOString();
    await updateDoc("tasks", id, d => {
      d = mustExist(d);
      if (done) return { ...d, status: "done", doneAt: at, doneBy: "user" };
      // Reopen: drop doneAt and doneBy. Every other field, reportedAt included, is kept.
      delete d.doneAt; delete d.doneBy;
      return { ...d, status: "open" };
    }, `${done ? "Tick" : "Untick"} task ${id}`);
    taskSavedAt.set(id, Date.now());
    noteSaved(key, done ? (taskLinger.has(id) ? "· לחיצה נוספת מבטלת" : "") : "· המשימה נפתחה מחדש");
    setNote(done ? "סומן כבוצע." : "המשימה נפתחה מחדש.");
    // Undo is one more write, the same as unticking.
    if (done && !quiet) toast(`${SAVED} · סומן: ${before?.text || ""}`, { undo: async () => {
      if (!await setTaskDone(id, false, true)) throw new Error("undo failed");
      return "הסימון בוטל. המשימה פתוחה שוב.";
    } });
    ok = true;
  } catch (err) {
    unlingerTask(id);
    if (before) tasks = tasks.map(x => (x.id === id ? before : x));
    setBtnNote(key, saveError(err, "הסימון לא נשמר. נסה שוב."), "warn");
  }
  taskBusy.delete(id);
  renderTaskViews();
  return ok;
}
function renderTaskViews() {
  renderBelt(); renderBadges();
  if (openEp) renderSheet();
}

/* ---------- Tab 1: the belt ---------- */
/* What holds an episode, in words: yours (purple), the team's (quiet), stuck (orange), or live (green).
   Stuck means the station is the team's, but they wait on an answer or a task from you. */
function whyOf(e) {
  const stage = stageOf(e);
  const st = STATIONS[stationIndex[stage]];
  if (stage === "posted") return { kind: "done", text: "עלה לאוויר" };
  const nA = epApprovals(e.id).length;
  const blk = epTasks(e.id).find(t => t.blocking);
  if (st.who !== "you") {
    // The user's open tasks on this episode stay counted, as they were on the belt.
    const nT = epTasks(e.id).length;
    const mine = nT ? ` · ${nT === 1 ? "משימה אחת שלך" : `${nT} משימות שלך`}` : "";
    if (nA) return { kind: "stuck", text: `תקוע: ${talkTo(st.who)} מחכה לאישור שלך${mine}` };
    if (blk) return { kind: "stuck", text: `תקוע: מחכה לך · ${blk.text}${mine}` };
    return { kind: "team", text: st.owner.split(" · ")[0] + mine };
  }
  if (blk) return { kind: "you", text: `מחכה לך: ${blk.text}` };
  if (nA) return { kind: "you", text: "מחכה לאישור שלך" };
  return { kind: "you", text: `מחכה לך: ${YOUR_ACTION[stage]}` };
}
const whyLine = w => `<span class="ewhy k-${w.kind}">${txt(w.text)}</span>`;

/* The ordered list of what waits for you: tasks that stop an episode, approvals (closest to going
   live first), episodes at your stations, then the rest of your tasks. */
function nextQueue() {
  const q = [];
  const epStage = id => (epById[String(id)] ? stationIndex[stageOf(epById[String(id)])] : -1);
  const open = openTasks();
  for (const t of open.filter(t => t.blocking))
    q.push({ kind: "task", id: t.id, ep: hasEp(t) ? String(t.episode) : null, kicker: "משימה שעוצרת פרק", title: t.text,
      why: [t.note, hasEp(t) ? `פרק ${t.episode} לא ממשיך בלי זה.` : ""].filter(Boolean).join(" · ") });
  for (const a of [...pendingApprovals()].sort((x, y) => epStage(y.episode) - epStage(x.episode) || byCreatedDesc(y, x)))
    q.push({ kind: "appr", id: a.id, ep: a.episode != null && epById[String(a.episode)] ? String(a.episode) : null,
      kicker: `אישור · מ${nameOf(a.from)}`, title: a.title, why: a.detail || "" });
  // An episode at the story station with an open task of its own is already listed by that task.
  for (const e of episodes.filter(e => isYours(e) && !(stageOf(e) === "story" && epTasks(e.id).length) && !epApprovals(e.id).length).sort(byClosest))
    q.push({ kind: "ep", id: e.id, ep: e.id, kicker: STATIONS[stationIndex[stageOf(e)]].name, title: `${YOUR_ACTION[stageOf(e)]} את פרק ${e.id}`, why: e.title });
  for (const t of open.filter(t => !t.blocking))
    q.push({ kind: "task", id: t.id, ep: hasEp(t) ? String(t.episode) : null, kicker: "משימה", title: t.text, why: t.note || "" });
  return q;
}

function renderNext() {
  const zone = document.getElementById("next-zone");
  const ready = loaded.tasks && loaded.approvals;
  let card;
  if (!ready) {
    card = `<section class="card all-clear" id="next"><p class="empty">${loadFailed ? "המשימות והאישורים לא נטענו. העמוד ינסה שוב בעוד דקה." : "טוען את הדבר הבא…"}</p></section>`;
  } else {
    const q = nextQueue();
    if (!q.length) {
      card = `<section class="card all-clear" id="next">${DONE_MARK}<div><b>אין שום דבר שמחכה לך.</b><div class="meta">הצוות עובד. נחזור כשיהיה משהו.</div></div></section>`;
    } else {
      const x = q[0];
      const ro = canWrite() ? "" : "disabled";
      const act = x.kind === "task"
        ? `<button class="btn primary" type="button" data-task-done="${esc(x.id)}" ${ro || (taskBusy.has(x.id) ? "disabled" : "")}>סימנתי שבוצע</button>`
        : x.kind === "appr"
          ? `<span class="quick-appr" data-actions style="margin:0"><button class="btn primary" data-decide="approved" data-id="${esc(x.id)}" data-where="next" ${ro}>אשר</button><button class="btn no" data-decide="rejected" data-id="${esc(x.id)}" data-where="next" ${ro}>דחה</button></span>`
          : `<button class="btn primary" type="button" data-ep="${esc(x.id)}">פתח את פרק ${esc(x.id)}</button>`;
      const epBtn = x.ep && x.kind !== "ep" && epById[x.ep] ? `<button class="btn" type="button" data-ep="${esc(x.ep)}">פתח את פרק ${esc(x.ep)}</button>` : "";
      const note = x.kind === "task" ? btnNote("task-" + x.id) : x.kind === "appr" ? btnNote("appr-" + x.id) : "";
      const then = q.slice(1, 3);
      card = `<section class="card next" id="next" aria-labelledby="h-next">
        <div class="next-top">
          ${x.ep ? `<span class="big-n" aria-hidden="true">${esc(x.ep)}</span>` : `<span class="ring" style="width:48px;height:48px" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8L16.3 9.5"/></svg></span>`}
          <div class="next-txt">
            <span class="next-kicker">הדבר הבא שלך · ${esc(x.kicker)}</span>
            <h2 class="next-title" id="h-next">${txt(x.title)}</h2>
            ${x.why ? `<p class="next-why">${txt(x.why)}</p>` : ""}
          </div>
        </div>
        <div class="next-actions">${act}${epBtn}${note}</div>
        ${canWrite() ? "" : `<p class="hint">${esc(roHint())}</p>`}
        ${then.length ? `<div class="then"><h3>אחר כך</h3>${then.map(y => `<button type="button" ${y.kind === "ep" ? `data-ep="${esc(y.id)}"` : `data-scrollto="${y.kind === "appr" ? "waiting" : "tasks"}"`}>
          <span class="dot-n">${y.ep ? esc(y.ep) : "·"}</span><span class="tt">${esc(y.title)}</span><span class="kind-s">${esc(y.kicker)}</span></button>`).join("")}</div>` : ""}
      </section>`;
    }
  }
  const open = openTasks();
  const nB = open.filter(t => t.blocking).length, nA = pendingApprovals().length;
  const nE = episodes.filter(e => stageOf(e) !== "posted").length;
  const n = v => (ready ? v : "–");
  const chips = `<div class="chips" role="group" aria-label="סיכום">
    <button class="chip" type="button" data-scrollto="tasks"><b id="st-open">${n(open.length)}</b>משימות פתוחות</button>
    <button class="chip ${ready && nB ? "hot" : ""}" type="button" data-scrollto="tasks"><b id="st-block">${n(nB)}</b>עוצרים פרק</button>
    <button class="chip ${ready && nA ? "hot" : ""}" type="button" data-scrollto="waiting"><b id="st-appr">${n(nA)}</b>אישורים</button>
    <button class="chip" type="button" data-scrollto="belt"><b id="st-eps">${nE}</b>פרקים בדרך</button>
  </div>`;
  paint(zone, card + chips);
}

function renderBelt() {
  // First, so the dots on episodes and approvals below are current.
  computeSince();
  const pend = pendingApprovals();
  const stale = staleRequests();
  const staleCards = stale.map(r => `<div class="wcard stale">
    <span class="kind">הוראה ל${esc(nameOf(r.to))} · נשלחה ${esc(ago(r.createdAt))}</span>
    ${clampText(`stale-${r.id}`, esc(r.text), "title", "span")}
    <span class="meta">אף אחד עוד לא אסף אותה. פתח שיחה עם ${esc(talkTo(r.to))}.</span>
    <button class="linkbtn more" type="button" data-go="requests">להוראות</button>
  </div>`);
  // Episodes at your stations live in "the next thing" and on the belt, so this section keeps
  // approvals and instructions nobody picked up, then your tasks.
  const cards = [...pend.map(a => approvalCard(a, "wait")), ...staleCards];
  const loading = !loadFailed && !(loaded.approvals && loaded.requests && loaded.tasks);
  const waiting = `<section class="waiting" id="waiting" aria-labelledby="h-wait">
    <div class="waiting-head"><h2 id="h-wait">אישורים והוראות</h2><span class="count">${bd(cards.length)}</span>
      ${loading ? `<span class="meta">טוען משימות, אישורים והוראות…</span>` : ""}
      ${btnNote("decided-wait")}
    </div>
    ${cards.length ? `<div class="wait-grid">${cards.join("")}</div>` : `<p class="card wait-empty">${loading ? "טוען…" : "אין אישורים שמחכים לך, ואין הוראות שנתקעו."}</p>`}
    ${yourTasks()}
  </section>`;

  const rows = beltMode === "rows";
  const belt = `<section class="sec" id="belt" aria-labelledby="h-belt">
    <div class="sec-head"><h2 class="sec-title" id="h-belt">פס הייצור</h2><span class="hint">לחיצה על פרק פותחת תסריט, משימות ואישורים</span>
      <div class="belt-tools"><div class="seg-ctl" role="group" aria-label="תצוגת הפס">
        <button type="button" data-belt="rows" aria-pressed="${rows}">שורות</button><button type="button" data-belt="belt" aria-pressed="${!rows}">עמדות</button></div></div></div>
    <div class="card belt-card">${rows ? rowsView() : stationsView()}</div>
  </section>`;

  const m = DATA.morning;
  const morning = m.items.length ? `<details class="fold" id="fold-morning"><summary>מה השתנה לאחרונה${m.date ? " · " + bd(m.date) : ""}</summary>
    <ul class="plain">${m.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></details>` : "";

  paint(document.getElementById("belt-body"), waiting + belt + decidedForYou() + morning);
  renderNext();
  renderSince();
}

function stationsView() {
  return `<ol class="belt">${STATIONS.map(s => {
    const eps = episodes.filter(e => stageOf(e) === s.key).sort((a, b) => +a.id - +b.id);
    const mine = s.who === "you";
    const who = mine ? YOU : s.who ? robot(s.who, 36, { busy: eps.length > 0 }) : DONE_MARK;
    const cls = ["station", mine && eps.length ? "mine" : "", eps.length ? "" : "idle", s.key === "posted" ? "posted" : ""].join(" ");
    return `<li class="${cls}">
      <div class="st-head"><div class="st-who">${who}</div>
        <div class="names"><div class="st-name">${esc(s.name)}</div>${s.owner ? `<div class="st-owner">${esc(s.owner)}</div>` : ""}</div></div>
      <div class="st-eps">${eps.length ? eps.map(e => {
        const w = whyOf(e);
        return `<button class="ep ${w.kind === "you" ? "wait" : ""} ${w.kind === "stuck" ? "stuck" : ""} ${openEp === e.id ? "sel" : ""}" data-ep="${esc(e.id)}" aria-label="${esc(epLabel(e))}: ${esc(e.title)}. ${esc(w.text)}">
          ${isNew("ep", e.id) ? NEW_DOT : ""}<span class="n">${esc(e.id)}</span><span style="min-width:0"><span class="t">${esc(e.title)}${cutMark(e.id)}</span>${whyLine(w)}</span></button>`;
      }).join("") : `<span class="st-idle">ריק</span>`}</div>
    </li>`;
  }).join("")}</ol>`;
}
function stageTrack(e) {
  const i = stationIndex[stageOf(e)], w = whyOf(e);
  const s = STATIONS[i];

// keepBusy: the caller has another write to make, so the note stays on "saving" after this one.
async function sendRequest(to, text, noteKey, keepBusy) {
  text = text.trim();
  if (!canWrite() || !text) return false;
  const createdAt = new Date().toISOString();
  const id = newId();
  unsaved.add(createdAt);
  noteSaving(noteKey);
  // Show it at once, marked unsaved, until the commit lands.
  requests = [{ id, to, text, status: "waiting", createdAt, _pending: true }, ...requests];
  renderRequests();
  try {
    await updateDoc("requests", id, d => {
      if (d) throw new GhError(0, "other");
      return { to, text, status: "waiting", createdAt };
    }, `Add request for ${to}`);
    unsaved.delete(createdAt);
    if (!keepBusy) {
      noteSaved(noteKey, `· נשלחה ל${nameOf(to)}.${isGrok(to) ? " מני מעביר בשיחה הבאה." : ""}`, 6000);
      // Undo cancels it, the same write as the cancel button: allowed only while nobody picked it up.
      toast(`${SAVED} · ההוראה נשלחה ל${nameOf(to)}`, { undo: async () => { await cancelRequest(id); return "ההוראה בוטלה."; } });
    }
    renderRequests(); renderBadges();
    return true;
  } catch (err) {
    unsaved.delete(createdAt);
    requests = requests.filter(r => r.id !== id);
    setBtnNote(noteKey, saveError(err, "ההוראה לא נשמרה. נסה שוב בעוד רגע."), "warn");
    renderRequests();
    return false;
  }
}
// Cancels a waiting instruction. Once an agent picked it up, it is his: the write is refused ("taken").
async function cancelRequest(id) {
  await updateDoc("requests", id, d => {
    d = mustExist(d);

/* ---------- 11. What changed since the last visit. Kept in this browser only ----------
   A snapshot of what the page showed when "seen" was pressed last. Without storage the page works as before. */
const SEEN_KEY = "nipo-seen-v1";
const NEW_DOT = `<span class="new-dot" role="img" aria-label="חדש"></span>`;
let seenSnap = null;        // the stored snapshot, or null
let seenReady = false;      // data loaded and snapshot compared
let sinceNew = { ep: new Set(), appr: new Set(), req: new Set() };
let sinceLines = [];
function snapshot() {
  return {
    at: new Date().toISOString(),
    eps: Object.fromEntries(episodes.map(e => [e.id, stageOf(e)])),
    appr: pendingApprovals().map(a => a.id),
    req: Object.fromEntries(requests.map(r => [r.id, r.status])),
    tasks: openTasks().map(t => t.id),
    gdec: grokDecisions.map(d => d.id),
  };
}
function saveSeen() {
  seenSnap = snapshot();
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seenSnap)); } catch (e) {}
}
function computeSince() {
  if (!(loaded.approvals && loaded.requests && loaded.tasks && loaded.grokDecisions)) return;
  if (!seenReady) {
    seenReady = true;
    try { seenSnap = JSON.parse(localStorage.getItem(SEEN_KEY) || "null"); } catch (e) { seenSnap = null; }
    // First visit in this browser: nothing is "new" yet. Remember what is here now.
    if (!seenSnap || typeof seenSnap !== "object" || !seenSnap.eps) { saveSeen(); }
  }
  const s = seenSnap || {};
  const lines = [];
  const ep = new Set(), appr = new Set(), req = new Set();
  for (const e of episodes) {
    const was = s.eps?.[e.id];
    if (was && was !== stageOf(e)) { ep.add(e.id); lines.push(`פרק ${e.id} עבר ל${STATIONS[stationIndex[stageOf(e)]].name}`); }
    else if (!was && s.eps) { ep.add(e.id); lines.push(`פרק ${e.id} חדש בפס`); }
  }
  const oldAppr = new Set(s.appr || []);
  for (const a of pendingApprovals()) if (!oldAppr.has(a.id)) {
    appr.add(a.id);
    const ep = a.episode != null && a.episode !== "" ? ` על פרק ${a.episode}` : "";
    lines.push(`אישור חדש מ${nameOf(a.from)}${ep}`);
  }
  const done = {}, picked = {};
  for (const r of requests) {
    const was = s.req?.[r.id];
    if (was === r.status || r.status === "cancelled" || (!was && r.status === "waiting")) continue;
    if (r.status === "done") { req.add(r.id); done[r.to] = (done[r.to] || 0) + 1; }
    else if (r.status === "picked") { req.add(r.id); picked[r.to] = (picked[r.to] || 0) + 1; }
  }
  const count = (n, one, many) => (n === 1 ? one : `${n} ${many}`);
  for (const [to, n] of Object.entries(done)) lines.push(`${nameOf(to)} סיים ${count(n, "הוראה אחת", "הוראות")}`);
  for (const [to, n] of Object.entries(picked)) lines.push(`${nameOf(to)} אסף ${count(n, "הוראה אחת", "הוראות")}`);
  const oldTasks = new Set(s.tasks || []);
  const nT = openTasks().filter(t => !oldTasks.has(t.id)).length;
  if (nT) lines.push(nT === 1 ? "משימה חדשה ברשימה שלך" : `${nT} משימות חדשות ברשימה שלך`);
  const oldG = new Set(s.gdec || []);
  const nG = grokDecisions.filter(d => !oldG.has(d.id)).length;
  if (nG) lines.push(nG === 1 ? "החלטה חדשה שדווחה בשמך" : `${nG} החלטות חדשות שדווחו בשמך`);
  sinceNew = { ep, appr, req };
  sinceLines = lines;
}
const isNew = (kind, id) => seenReady && sinceNew[kind]?.has(String(id));
function renderSince() {
  const zone = document.getElementById("since-zone");
  const html = seenReady && sinceLines.length ? `<section class="card since" id="since" aria-label="מה השתנה מאז הביקור">
    <span class="lbl">מאז שסימנת ראיתי${seenSnap?.at ? ` · ${bd(fmtDate(seenSnap.at))}` : ""}</span>
    <ul>${sinceLines.slice(0, 8).map(l => `<li>${txt(l)}</li>`).join("")}${sinceLines.length > 8 ? `<li>ועוד ${bd(sinceLines.length - 8)}</li>` : ""}</ul>
    <button class="btn small" type="button" data-act="seen">ראיתי</button></section>` : "";

/* ---------- 6. A short bar at the bottom, with undo for six seconds ----------
   undo() makes one more write and resolves with what to say; the bar waits for it. */
const UNDO_MS = 6000;
let toastTimer = null;
function toast(text, opts = {}) {
  const wrap = document.getElementById("toasts");
  clearTimeout(toastTimer);
  const el = document.createElement("div");
  el.className = "toast" + (opts.warn ? " warn" : "");
  el.setAttribute("role", "status");
  el.innerHTML = `<span class="tt">${esc(text)}</span>${opts.undo ? `<button class="undo" type="button">ביטול</button>` : ""}`;
  wrap.innerHTML = "";
  wrap.appendChild(el);
  const drop = ms => { clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), ms); };
  drop(opts.undo ? UNDO_MS : 3500);
  if (opts.undo) {
    const btn = el.querySelector(".undo");
    btn.addEventListener("click", async () => {
      clearTimeout(toastTimer);
      btn.disabled = true;
      el.querySelector(".tt").textContent = SAVING;
      try {
        const said = await opts.undo();
        el.querySelector(".tt").textContent = `${SAVED} ${said || "בוטל."}`;
        btn.remove();
        drop(3500);
      } catch (err) {
        el.classList.add("warn");
        el.querySelector(".tt").textContent = err?.kind === "taken" ? "כבר מאוחר מדי: הסוכן אסף את זה." : saveError(err, "הביטול לא נשמר. נסה שוב.");
        btn.remove();
        drop(6000);
      }
    });
  }
}

/* ---------- 6. Approve or reject: saved at once. Undo puts it back to pending ---------- */
async function decideApproval(id, status, note, where, btns) {
  if (!canWrite()) return;
  const key = "appr-" + id;
  const a = approvals.find(x => x.id === id);
  btns?.forEach(b => b.disabled = true);
  noteSaving(key);
  try {
    const decidedAt = new Date().toISOString();
    await updateDoc("approvals", id, d => {
      d = mustExist(d);
      if (d.status !== "pending") throw new GhError(0, "decided");
      return { ...d, status, decidedAt, note };
    }, `${status === "approved" ? "Approve" : "Reject"} ${id}`);
    setBtnNote(key, "");
    noteOpen.delete(`${where}-${id}`);
    const word = status === "approved" ? "אושר" : "נדחה";
    toast(`${SAVED} · ${word}: ${a?.title || ""}`, { undo: async () => { await undoDecision(id); return "ההחלטה בוטלה. האישור חזר לרשימה."; } });
    setNote(status === "approved" ? "אושר. הסוכן ימשיך בשיחה הבאה." : "נדחה. הסוכן יראה את זה בשיחה הבאה.");
    renderBelt(); renderBadges();
    if (openEp) renderSheet();
  } catch (err) {
    btns?.forEach(b => { if (document.contains(b)) b.disabled = false; });
    const msg = err?.kind === "decided" ? "האישור הזה כבר הוכרע." : saveError(err, "ההחלטה לא נשמרה. נסה שוב.");
    setBtnNote(key, msg, "warn");
    if (where === "pal") toast(msg, { warn: true });
    if (err?.kind === "decided") refresh(true);
  }
}
// The second write: back to pending, without decidedAt and note. Refused once an agent handled it.
async function undoDecision(id) {
  await updateDoc("approvals", id, d => {
    d = mustExist(d);
    if (d.handledAt) throw new GhError(0, "taken");
    delete d.decidedAt; delete d.note;
    return { ...d, status: "pending" };
  }, `Undo decision ${id}`);
  renderBelt(); renderBadges();
  if (openEp) renderSheet();
}

// Shortcuts never fire while typing in a field, and are matched by the key's place (ev.code),

    if (ev.key === "Escape") { ev.preventDefault(); closeOverlay(); return; }
    if (ovKind === "palette") {
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();
        if (palItems.length) { palSel = (palSel + (ev.key === "ArrowDown" ? 1 : -1) + palItems.length) % palItems.length; drawPalette(document.getElementById("pal-in").value); }
        return;
      }
      if (ev.key === "Enter") { ev.preventDefault(); runPal(palSel); return; }
    }
    if (ovKind === "compose" && ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) {
      ev.preventDefault();
      const f = document.getElementById("qc-form");
      if (f && !document.getElementById("qc-send")?.disabled) f.requestSubmit();
      return;
    }
    if (ev.key === "Tab") { // keep focus inside the overlay
      const f = [...document.getElementById("ov").querySelectorAll("button, input, textarea, [href]")].filter(x => !x.disabled);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
    return;
  }
  if (ev.key === "Escape") {
    if (openEp) { closeSheet(); return; }
    if (typing(ev.target)) ev.target.blur();
    return;
  }
  if (typing(ev.target) || ev.isComposing) return;
  if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && ev.code === "KeyK") { ev.preventDefault(); openOverlay("palette"); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (openEp && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) { ev.preventDefault(); stepEpisode(ev.key === "ArrowDown" ? 1 : -1); return; }
  if (ev.code === "Slash" && ev.shiftKey) { ev.preventDefault(); openOverlay("help"); return; }
  if (ev.code === "Slash" && !ev.shiftKey) { ev.preventDefault(); focusSearch(); return; }
  if (ev.code === "KeyN" && !ev.shiftKey) { ev.preventDefault(); toCompose(); return; }
  const m = /^(?:Digit|Numpad)([1-4])$/.exec(ev.code);
  if (m && !ev.shiftKey) {
    ev.preventDefault();
    if (openEp && !wide()) closeSheet();
    selectView(VIEWS[+m[1] - 1]);
    document.getElementById("nav-" + VIEWS[+m[1] - 1])?.focus({ preventScroll: true });
  }
});
