<!-- The logo's purple core: a glowing orb on the dark ground, drawn inline. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='h'%3E%3Cstop offset='.4' stop-color='%238B5CF6' stop-opacity='.75'/%3E%3Cstop offset='1' stop-color='%238B5CF6' stop-opacity='0'/%3E%3C/radialGradient%3E%3CradialGradient id='c' cx='.36' cy='.32' r='.72'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.1' stop-color='%23e9ddff'/%3E%3Cstop offset='.32' stop-color='%23b69cff'/%3E%3Cstop offset='.6' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%233b1580'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2307080f'/%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23h)'/%3E%3Ccircle cx='32' cy='32' r='17' fill='url(%23c)'/%3E%3C/svg%3E">

<!-- Only the four glyphs Kodi's robot face draws, so the robot stays exactly as drawn. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&text=%3E_%3C%2F&display=swap">
<style>
  /* Same tokens as the tasks page, one to one, so both feel like one system. Single dark look. */
  :root {
    color-scheme: dark;
    --bg: #07080f; --bg2: #0b0d18; --card: #0f1220; --card2: #141829; --card3: #191e33;
    --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.12);
    --text: #eef0f8; --muted: #8b90a8; --dim: #5d6280;
    --accent: #8B5CF6; --accent2: #A78BFA; --accent-soft: rgba(139,92,246,.16);
    --green: #34d399; --violet: #d08cff; --orange: #fb923c; --blue: #60a5fa;
    --red: #f87171;
    --grok: #D9D4E7;
    --warn: var(--orange); --ok: var(--green); --bad: var(--red);
    --sans: "Heebo", "Rubik", "IBM Plex Sans Hebrew", "Assistant", "Segoe UI", "Arial Hebrew", -apple-system, BlinkMacSystemFont, "Noto Sans Hebrew", Roboto, Arial, sans-serif;
    --serif: "Frank Ruhl Libre", "David Libre", "Noto Serif Hebrew", "Taamey Frank CLM", "David", "Times New Roman", Georgia, serif;
    --tabbar: 68px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  [hidden] { display: none !important; }
  body {
    font-family: var(--sans); font-size: 16px; line-height: 1.55; direction: rtl; -webkit-font-smoothing: antialiased;
    background: radial-gradient(900px 500px at 85% -10%, rgba(139,92,246,.10), transparent 60%), var(--bg); min-height: 100vh;
  }
  bdi, .ltr { unicode-bidi: isolate; direction: ltr; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* ---------- Layout: side tiles on desktop, bottom tab bar on phones ---------- */
  .app { min-height: 100vh; }
  .side { padding: 14px 16px 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .orb {
    width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 34% 30%, #fff 0, #e9ddff 8%, #b69cff 24%, #8B5CF6 48%, #4c1d95 78%, #1e0b44 100%);
    box-shadow: 0 0 18px 2px rgba(139,92,246,.55), 0 0 42px 6px rgba(139,92,246,.18), inset -3px -4px 8px rgba(0,0,0,.35);
  }
  .brand b { font-weight: 800; font-size: 17px; letter-spacing: .01em; display: block; }
  .brand b .dot { color: var(--accent2); font-weight: 700; }
  .brand b bdi { color: var(--accent2); letter-spacing: .08em; }
  .brand small { display: block; color: var(--muted); font-size: 11.5px; letter-spacing: .05em; font-weight: 600; margin-top: -2px; }

  .tiles {
    position: fixed; inset: auto 0 0 0; z-index: 30; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); background: rgba(9,10,19,.88);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line2);
  }
  .tile {
    appearance: none; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 6px 2px; border-radius: 12px; cursor: pointer; min-height: 54px; -webkit-tap-highlight-color: transparent;
    font-size: 11px; font-weight: 600; line-height: 1.15; position: relative; min-width: 0; text-align: center; overflow-wrap: anywhere;
  }
  .tile .ic { width: 32px; height: 28px; border-radius: 10px; display: grid; place-items: center; transition: .15s; }
  .tile .ic .ico { width: 19px; height: 19px; }
  .tile[aria-selected="true"] { color: #fff; }
  .tile[aria-selected="true"] .ic { background: var(--accent-soft); color: var(--accent2); box-shadow: inset 0 0 0 1px rgba(167,139,250,.35); }
  .tile:focus-visible { outline: 2px solid var(--accent2); outline-offset: 1px; }
  .badge {
    position: absolute; top: 3px; inset-inline-start: calc(50% + 8px);
    min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: #fff; box-shadow: 0 0 10px rgba(139,92,246,.6);
    font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; padding: 0 5px;
    font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate;
  }
  .badge.warn { background: var(--orange); color: var(--bg); box-shadow: 0 0 10px rgba(251,146,60,.6); }

  .main { padding: 10px 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)); max-width: 1180px; min-width: 0; }

  /* Top bar: search */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 0 12px;
    background: linear-gradient(var(--bg) 70%, rgba(7,8,15,0));
  }
  .search { flex: 1; position: relative; min-width: 0; }
  .search .ico { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--dim); width: 18px; height: 18px; pointer-events: none; }
  .search input {
    width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line2); background: var(--card); color: var(--text);
    font: inherit; font-size: 16px; padding-inline: 44px 14px; outline: none; transition: .15s; -webkit-appearance: none; appearance: none;
  }
  .search input::placeholder { color: var(--dim); }
  .search input:focus { border-color: rgba(167,139,250,.6); box-shadow: 0 0 0 4px rgba(139,92,246,.16); }
  .search input::-webkit-search-cancel-button { filter: invert(.6); }
  .upd { display: none; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .upd bdi { color: var(--text); }

  /* ---------- Cards ---------- */
  .card { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 20px; }
  .label { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 8px; }
  .label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex: none; }

  /* Hero: stars and purple glow, greeting by the hour, never a name */
  .hero {
    position: relative; overflow: hidden; padding: 26px 20px 22px;
    background: radial-gradient(420px 220px at 12% 0%, rgba(139,92,246,.22), transparent 70%),
                radial-gradient(300px 200px at 100% 110%, rgba(167,139,250,.10), transparent 70%),
                linear-gradient(180deg, #111427, #0c0e1b);
  }
  .hero::before, .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .hero::before {
    opacity: .9;
    background-image:
      radial-gradient(1.4px 1.4px at 8% 22%, #fff, transparent), radial-gradient(1px 1px at 16% 70%, #cfc3ff, transparent),
      radial-gradient(1.2px 1.2px at 24% 38%, #fff, transparent), radial-gradient(1px 1px at 31% 12%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 38% 58%, #e4dcff, transparent), radial-gradient(1px 1px at 44% 84%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 52% 26%, #fff, transparent), radial-gradient(1px 1px at 58% 66%, #bda9ff, transparent),
      radial-gradient(1.5px 1.5px at 64% 16%, #fff, transparent), radial-gradient(1px 1px at 70% 46%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 76% 80%, #fff, transparent), radial-gradient(1px 1px at 82% 30%, #d9ceff, transparent),
      radial-gradient(1.7px 1.7px at 88% 62%, #fff, transparent), radial-gradient(1px 1px at 93% 14%, #fff, transparent),
      radial-gradient(1px 1px at 97% 88%, #fff, transparent), radial-gradient(1.2px 1.2px at 5% 90%, #fff, transparent),
      radial-gradient(1px 1px at 48% 8%, #fff, transparent), radial-gradient(1px 1px at 67% 92%, #cbbcff, transparent);
    -webkit-mask-image: linear-gradient(90deg, #000, rgba(0,0,0,.35)); mask-image: linear-gradient(90deg, #000, rgba(0,0,0,.35));
  }
  /* A second, sparser layer twinkles. It stops when the system asks for less motion. */
  .hero::after {
    background-image:
      radial-gradient(1.6px 1.6px at 20% 30%, #fff, transparent), radial-gradient(1.3px 1.3px at 41% 72%, #e4dcff, transparent),
      radial-gradient(1.8px 1.8px at 61% 40%, #fff, transparent), radial-gradient(1.2px 1.2px at 79% 18%, #cfc3ff, transparent),
      radial-gradient(1.5px 1.5px at 91% 76%, #fff, transparent), radial-gradient(1.2px 1.2px at 12% 55%, #fff, transparent);
    animation: twinkle 4.8s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .95; } }
  .hero > * { position: relative; z-index: 1; }
  .date { font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--accent2); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .date::before { content: ""; width: 18px; height: 1px; background: currentColor; opacity: .6; }
  .hello { font-family: var(--serif); font-weight: 700; font-size: 36px; line-height: 1.1; margin: 0; letter-spacing: -.005em; }
  .hello em { font-style: normal; color: var(--accent2); text-shadow: 0 0 24px rgba(139,92,246,.45); }
  .prog { display: flex; align-items: center; gap: 12px; margin-top: 18px; max-width: 460px; }
  .bar { flex: 1; height: 8px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 99px; box-shadow: 0 0 12px rgba(139,92,246,.7); transition: width .35s ease; }
  .prog-count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .prog-count b { color: var(--text); font-weight: 700; }
  .upd-m { color: var(--dim); font-size: 12.5px; margin-top: 8px; }
  .upd-m bdi { color: var(--muted); }

  /* Stats: big number, faint 01-04 behind */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { position: relative; overflow: hidden; padding: 14px 16px; min-height: 108px; display: flex; flex-direction: column; }
  .stat .k { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
  .stat .v { font-size: 38px; font-weight: 800; line-height: 1; margin-top: auto; padding-top: 14px; color: var(--c, var(--text)); font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .stat .ghost {
    position: absolute; inset-inline-end: -6px; bottom: -22px; font-size: 92px; font-weight: 900; line-height: 1; color: rgba(255,255,255,.035);
    letter-spacing: -.04em; pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .stat.alert { border-color: rgba(139,92,246,.35); background: radial-gradient(200px 120px at 100% 0%, rgba(139,92,246,.18), transparent 70%), linear-gradient(180deg, var(--card2), var(--card)); }
  .stat .v, .stat .ghost { direction: ltr; unicode-bidi: isolate; text-align: right; }

  /* Search hides everything but the task list, like the tasks page */
  body.searching .strip, body.searching #next-zone, body.searching #since-zone, body.searching .wait-grid, body.searching .wait-empty,
  body.searching #belt-body > :not(.waiting), body.searching .waiting-head { display: none !important; }

  /* ---------- Panels and sections ---------- */
  .panel { display: flex; flex-direction: column; gap: 14px; }
  .dash { display: flex; flex-direction: column; gap: 14px; }
  #belt-body { display: flex; flex-direction: column; gap: 22px; margin-top: 8px; }
  h2.sec-title { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.2; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 2px 0; }
  .sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .hint { color: var(--muted); font-size: 14px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .count { color: var(--muted); font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.05); border-radius: 99px; padding: 3px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { color: var(--muted); margin: 0; }
  .alert-bar { background: rgba(251,146,60,.10); border: 1px solid rgba(251,146,60,.45); color: var(--orange); border-radius: 14px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }
  .ring {
    --c: var(--accent); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--c); flex: 0 0 auto;
    background: radial-gradient(circle, color-mix(in srgb, var(--c) 18%, transparent), color-mix(in srgb, var(--c) 6%, transparent) 70%);
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 70%, transparent), 0 0 18px -4px color-mix(in srgb, var(--c) 60%, transparent);
  }
  .ring .ico { width: 17px; height: 17px; }

  /* Robots */
  .robot { display: block; flex: none; overflow: visible; }
  .robot .bulb { transform-origin: 24px 5px; }
  .robot.busy .bulb { animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 0%, 60%, 100% { opacity: 1; } 75% { opacity: .25; } }
  .you {
    width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--accent);
    display: grid; place-items: center; box-shadow: 0 0 0 4px var(--accent-soft), 0 0 16px rgba(139,92,246,.55);
  }
  .you.done { background: var(--green); box-shadow: 0 0 12px rgba(52,211,153,.45); }

  /* Buttons and inputs */
  .btn {
    font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 12px; padding: 8px 16px;
    border: 1px solid var(--line2); background: var(--card3); color: var(--text); transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .btn:hover:not(:disabled) { border-color: rgba(167,139,250,.45); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 14px -2px rgba(139,92,246,.6); }
  .btn.ok { color: var(--green); border-color: rgba(52,211,153,.35); }
  .btn.no { color: var(--red); border-color: rgba(248,113,113,.35); }
  .btn.small { font-size: 13px; padding: 5px 12px; font-weight: 500; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
  textarea, input[type="text"], input[type="password"] {
    font: inherit; font-size: 16px; color: var(--text); background: var(--card); -webkit-appearance: none; appearance: none;
    border: 1px solid var(--line2); border-radius: 14px; padding: 10px 14px; width: 100%; resize: vertical; outline: none; transition: .15s;
  }
  textarea:focus, input[type="text"]:focus, input[type="password"]:focus { border-color: rgba(167,139,250,.6); box-shadow: 0 0 0 4px rgba(139,92,246,.16); }
  textarea::placeholder, input::placeholder { color: var(--dim); }
  .btn-note { font-size: 13px; color: var(--green); }
  .btn-note:empty { display: none; }
  .btn-note.warn { color: var(--orange); }
  .btn-note.busy { color: var(--muted); }
  .btn-note.ok { font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* What waits for you */
  .waiting { display: flex; flex-direction: column; gap: 12px; }
  .waiting-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 2px 0; }
  .waiting-head .big { font-family: var(--serif); font-weight: 700; font-size: 34px; line-height: 1; color: var(--accent2); text-shadow: 0 0 24px rgba(139,92,246,.45); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  .waiting-head h2 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 24px; }
  .wait-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
  .wcard {
    background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 6px; text-align: right; min-width: 0; transition: border-color .15s, background .15s;
  }
  .wcard.appr { border-color: rgba(139,92,246,.35); background: radial-gradient(220px 120px at 100% 0%, rgba(139,92,246,.14), transparent 70%), linear-gradient(180deg, var(--card2), var(--card)); }
  button.wcard { cursor: pointer; }
  button.wcard:hover { border-color: var(--line2); background: linear-gradient(180deg, var(--card3), var(--card2)); }
  .wcard .kind { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--accent2); font-weight: 700; letter-spacing: .03em; }
  .wcard .title { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
  .wcard .detail { color: var(--muted); font-size: 14px; white-space: pre-wrap; margin: 0; overflow-wrap: anywhere; }
  .wcard.stale { border-color: rgba(251,146,60,.45); }
  .linkbtn.more { color: var(--accent2); font-weight: 600; font-size: 13px; align-self: flex-start; min-height: 32px; }
  .wcard.stale .kind { color: var(--orange); }
  .wcard .ep-line { display: flex; align-items: center; gap: 12px; }
  .wcard .ep-line .num { font-family: var(--serif); font-weight: 700; font-size: 30px; line-height: 1; color: var(--accent2); text-shadow: 0 0 18px rgba(139,92,246,.45); direction: ltr; unicode-bidi: isolate; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .approval-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .approval-actions input { flex: 1 1 100%; min-width: 0; font-size: 15px; padding: 7px 12px; border-radius: 12px; }
  .wait-empty { padding: 16px; color: var(--muted); margin: 0; }

  /* Your tasks: one list, checked only here */
  .ytasks { padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .3s, border-color .3s; }
  .ytasks.hot {
    border-color: rgba(139,92,246,.55);
    background: radial-gradient(360px 180px at 100% 0%, rgba(139,92,246,.24), transparent 70%), linear-gradient(180deg, #171430, #100f22);
    box-shadow: 0 0 0 1px rgba(139,92,246,.18), 0 18px 40px -18px rgba(139,92,246,.6);
  }
  .ytasks-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 2px; }
  .ytasks-head h3 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; }
  .ytasks-head .count { margin-inline-start: auto; }
  .ytasks-head .hint { flex-basis: 100%; font-size: 13.5px; }
  ul.ytask-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  label.ytask {
    display: flex; gap: 12px; align-items: flex-start; padding: 13px 12px; min-height: 54px; cursor: pointer; position: relative;
    border-radius: 14px; background: rgba(255,255,255,.028); border: 1px solid var(--line); -webkit-tap-highlight-color: transparent;
    transition: background .15s, border-color .15s;
  }
  label.ytask:hover { background: rgba(255,255,255,.045); border-color: var(--line2); }
  label.ytask input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .box { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 8px; border: 2px solid #444a66; display: grid; place-items: center; transition: .15s; margin-top: 1px; }
  .box svg { width: 16px; height: 16px; opacity: 0; transform: scale(.6); transition: .15s; }
  label.ytask input:checked + .box, label.task input:checked + .box { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px rgba(139,92,246,.6); }
  label.ytask input:checked + .box svg, label.task input:checked + .box svg { opacity: 1; transform: none; }
  label.ytask input:focus-visible + .box, label.task input:focus-visible + .box { outline: 3px solid rgba(139,92,246,.6); outline-offset: 2px; }
  label.ytask input:disabled + .box, label.task input:disabled + .box { opacity: .5; }
  .ytask-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .ytask-text { font-size: 16.5px; line-height: 1.45; overflow-wrap: anywhere; }
  .ytask-note { color: var(--muted); font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
  .ytask-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ytask-tags .tag { font-size: 11.5px; padding: 1px 8px; }
  .tag.src { color: var(--muted); }
  .tag.epno { color: var(--accent2); border-color: rgba(167,139,250,.35); }
  .urgent {
    display: block; width: fit-content; margin-bottom: 2px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: #fff;
    background: var(--accent); border-radius: 99px; padding: 2px 9px; box-shadow: 0 0 12px rgba(139,92,246,.6);
  }
  li.ytask-blocking label.ytask {
    border-color: rgba(139,92,246,.55);
    background: radial-gradient(260px 120px at 100% 0%, rgba(139,92,246,.20), transparent 70%), rgba(255,255,255,.028);
    box-shadow: 0 0 0 1px rgba(139,92,246,.18), 0 10px 26px -14px rgba(139,92,246,.7);
  }
  li.ytask-blocking .ytask-text { font-weight: 600; }
  label.ytask input:checked ~ .ytask-body .ytask-text { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.35); font-weight: 400; }
  details.fold.ytask-done { background: none; border-style: dashed; }
  details.fold.ytask-done ul.ytask-list { margin-top: 4px; }

  /* The belt: stations flow right to left on wide screens, top to bottom on narrow ones */
  .belt-card { padding: 16px 14px; background: var(--card); }
  .belt { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; position: relative; }
  .belt::before {
    content: ""; position: absolute; top: 34px; inset-inline: 40px; height: 4px; border-radius: 2px;
    background: repeating-linear-gradient(90deg, rgba(167,139,250,.28) 0 8px, transparent 8px 14px);
    animation: roll-x 1.6s linear infinite;
  }
  @keyframes roll-x { to { background-position: -14px 0; } }
  .station { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .st-head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .st-who { height: 48px; display: grid; place-items: center; background: var(--card); padding-inline: 6px; }
  .st-name { font-weight: 700; font-size: 14px; line-height: 1.25; }
  .st-owner { color: var(--muted); font-size: 12px; line-height: 1.3; }
  .station.mine .st-name { color: var(--accent2); }
  .st-eps { display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,.028); border: 1px solid var(--line); border-radius: 14px; padding: 6px; min-height: 44px; }
  .station.mine .st-eps { border-color: rgba(139,92,246,.45); background: radial-gradient(120px 80px at 100% 0%, rgba(139,92,246,.18), transparent 70%), rgba(255,255,255,.028); box-shadow: 0 10px 26px -16px rgba(139,92,246,.7); }
  .station.idle .st-eps { background: none; border-style: dashed; }
  .ep {
    cursor: pointer; display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: right;
    background: var(--card3); border: 1px solid var(--line); border-radius: 12px; padding: 7px 8px; min-width: 0; transition: border-color .15s;
  }
  .ep:hover { border-color: rgba(167,139,250,.45); }
  .ep .n {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font-weight: 800; font-size: 13px; background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .ep .t { font-size: 13px; color: var(--muted); line-height: 1.35; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ep.wait { border-color: rgba(139,92,246,.6); box-shadow: 0 0 14px -4px rgba(139,92,246,.6); }
  .ep.wait .n { background: var(--accent); color: #fff; }
  .station.posted .ep .n { background: var(--green); color: var(--bg); }
  .ep .flag { display: block; font-size: 11px; color: var(--accent2); font-weight: 700; }
  .st-idle { color: var(--dim); font-size: 12px; text-align: center; padding: 6px 0; }
  @media (max-width: 1150px) {
    .belt { grid-template-columns: 1fr; gap: 6px; }
    .belt::before { top: 24px; bottom: 24px; inset-inline: auto; right: 29px; width: 4px; height: auto;
      background: repeating-linear-gradient(180deg, rgba(167,139,250,.28) 0 8px, transparent 8px 14px); animation-name: roll-y; }
    @keyframes roll-y { to { background-position: 0 14px; } }
    .station { flex-direction: row; align-items: flex-start; gap: 10px; }
    .st-head { flex-direction: row; align-items: center; text-align: right; width: 38%; min-width: 0; flex: none; }
    .st-who { width: 48px; height: 44px; flex: none; }
    .st-head .names { min-width: 0; }
    .st-eps { flex: 1; min-width: 0; min-height: 0; }
    .station.idle .st-eps { border: 0; padding: 0; }
    .st-idle { text-align: right; }
  }
  @media (min-width: 1151px) { .st-head .names { display: flex; flex-direction: column; gap: 2px; } }

  details.fold { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; }
  details.fold > summary { cursor: pointer; color: var(--muted); font-size: 15px; font-weight: 600; }
  details.fold[open] > summary { margin-bottom: 10px; }
  ul.plain { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; }

  /* Instructions */
  .composer { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .seg-ctl { display: inline-flex; flex-wrap: wrap; background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 3px; gap: 2px; max-width: 100%; }
  .targets { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .target-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 100%; }
  .target-row .lbl { font-size: 12px; color: var(--muted); font-weight: 600; min-width: 4.5ch; }
  .relay { color: var(--grok); font-size: 13px; }

  /* The team in Grok: one shared mark, no robots */
  .gmark {
    flex: none; border-radius: 50%; display: inline-grid; place-items: center;
    border: 1.5px dashed var(--grok); color: var(--grok); background: var(--card);
    font-weight: 700; line-height: 1;
  }
  .gchip { flex: none; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 0 8px; color: var(--grok); border: 1px dashed rgba(217,212,231,.4); white-space: nowrap; }
  .silent-tag { display: inline-block; width: fit-content; font-size: 12px; font-weight: 700; color: var(--orange); border: 1px solid rgba(251,146,60,.45); border-radius: 99px; padding: 0 8px; }

  /* Decided on your behalf */
  ul.gdec { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.gdec li { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px dashed rgba(217,212,231,.25); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
  ul.gdec li.objected { border-style: solid; border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.05); }
  ul.gdec li.objected .q-text { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(248,113,113,.55); }
  .tag.objected { color: var(--red); border-color: rgba(248,113,113,.35); }
  .seg-ctl button { font-size: 14px; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .seg-ctl button[aria-pressed="true"] { background: var(--accent-soft); color: #fff; box-shadow: inset 0 0 0 1px rgba(167,139,250,.55), 0 0 14px -4px rgba(139,92,246,.6); }
  ul.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.queue li { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
  ul.queue li.stale { border-color: rgba(251,146,60,.45); }
  .q-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .q-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .q-result { color: var(--muted); font-size: 14px; border-inline-start: 2px solid var(--line2); padding-inline-start: 8px; overflow-wrap: anywhere; }
  .q-result b { color: var(--dim); font-weight: 600; }
  .q-stale { color: var(--orange); font-size: 13px; }
  .q-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .tag { flex: none; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 1px 9px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
  .tag.waiting { color: var(--orange); border-color: rgba(251,146,60,.35); }
  .tag.picked { color: var(--accent2); border-color: rgba(167,139,250,.35); }
  .tag.done { color: var(--green); border-color: rgba(52,211,153,.35); }
  .tag.unsaved { color: var(--red); border-color: rgba(248,113,113,.35); }

  /* Agents: one card per agent, Claude team then Grok team */
  .agent-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
  .acard { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; height: 100%; }
  .acard.grok { border-style: dashed; border-color: rgba(217,212,231,.25); }
  .acard.silent { border: 1px solid rgba(251,146,60,.45); background: radial-gradient(220px 120px at 100% 0%, rgba(251,146,60,.10), transparent 70%), linear-gradient(180deg, var(--card2), var(--card)); }
  .acard-top { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .acard-who { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .acard-name { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; }
  .acard-last { margin: 0; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
  .acard-last.none { color: var(--dim); }
  .acard-wait { margin: 0; font-size: 14px; color: var(--orange); overflow-wrap: anywhere; }
  .acard-when { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .acard-when bdi { color: var(--dim); font-variant-numeric: tabular-nums; }

  /* Access key: one quiet line when saving is off, a masked field when opened */
  .keybar { padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; border-color: rgba(167,139,250,.30); }
  .keybar.bad { border-color: rgba(251,146,60,.45); }
  .kb-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .keybar.bad .kb-line { color: var(--orange); }
  .kb-line .kb-text { flex: 1 1 16ch; min-width: 0; }
  .kb-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .kb-form input { flex: 1 1 220px; min-width: 0; font-size: 15px; padding: 8px 12px; border-radius: 12px; direction: ltr; }
  .kb-help { margin: 0; color: var(--dim); font-size: 13px; }
  /* No key yet, or the key was refused: a card that can't be missed, glowing like the blocking tasks */
  .keycard {
    padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; min-width: 0;
    border-color: rgba(139,92,246,.55);
    background: radial-gradient(360px 180px at 100% 0%, rgba(139,92,246,.26), transparent 70%), linear-gradient(180deg, #171430, #100f22);
    box-shadow: 0 0 0 1px rgba(139,92,246,.18), 0 18px 40px -18px rgba(139,92,246,.6);
  }
  .kc-top { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
  .kc-top .ring { width: 42px; height: 42px; }
  .kc-top .ring .ico { width: 20px; height: 20px; }
  .kc-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .kc-title { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .kc-bad { margin: 0; color: var(--orange); font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere; }
  .kc-actions { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .btn.big { font-size: 16.5px; font-weight: 700; padding: 13px 26px; border-radius: 14px; min-height: 50px; }
  .keycard .kb-form input { font-size: 16px; padding: 11px 14px; border-radius: 12px; flex-basis: 100%; }
  .keycard .kb-form .btn { min-height: 44px; }
  .kc-small { margin: 0; color: var(--muted); font-size: 13px; }
  @media (max-width: 520px) { .kc-actions .btn.big { flex: 1 1 100%; } .kc-top .ring { display: none; } }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .linkbtn:hover { color: var(--text); }

  /* Dev and decisions */
  .cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 22px; align-items: start; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
  .segs { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; }
  .seg { height: 8px; border-radius: 99px; background: rgba(255,255,255,.06); overflow: hidden; position: relative; }
  .seg i { position: absolute; inset: 0 0 0 auto; background: #97C459; display: block; border-radius: 99px; }
  .seg.cur { box-shadow: 0 0 0 1px #97C459, 0 0 10px rgba(151,196,89,.5); }
  .dev-now { display: flex; gap: 12px; align-items: center; padding: 14px 16px; }
  .dev-now .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .stage { display: flex; flex-direction: column; gap: 6px; }
  .stage h3 { margin: 0; font-size: 16px; font-weight: 700; }
  ul.plan { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  ul.plan li { border-bottom: 1px solid var(--line); padding: 9px 2px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  ul.plan .num { font-size: 13px; font-weight: 600; color: var(--dim); min-width: 3ch; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  ul.plan .txt { flex: 1; min-width: 12ch; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; border: 1px solid var(--line2); color: var(--muted); }
  .pill.done { color: var(--green); border-color: rgba(52,211,153,.35); }
  .pill.progress { color: var(--orange); border-color: rgba(251,146,60,.35); }
  .pill.blocked { color: var(--red); border-color: rgba(248,113,113,.35); }
  .pill::before { content: "○ "; }
  .pill.done::before { content: "● "; }
  .pill.progress::before { content: "◐ "; }
  .pill.blocked::before { content: "■ "; }
  .shot-states { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .journal-entry { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .journal-entry h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--accent2); direction: ltr; unicode-bidi: isolate; text-align: right; }
  .decisions { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .decision { border-bottom: 1px solid var(--line); padding: 10px 2px; display: grid; grid-template-columns: 11ch 1fr; gap: 12px; }
  .decision .d { font-size: 13px; font-weight: 600; color: var(--dim); padding-top: 2px; direction: ltr; unicode-bidi: isolate; text-align: right; font-variant-numeric: tabular-nums; }
  .decision .why { color: var(--muted); font-size: 14px; }
  @media (max-width: 520px) { .decision { grid-template-columns: 1fr; gap: 2px; } }

  /* Episode sheet */
  .sheet-back { position: fixed; inset: 0; background: rgba(4,5,10,.82); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    background: linear-gradient(180deg, var(--card2), var(--bg2)); border: 1px solid var(--line2); border-bottom: 0; border-radius: 22px 22px 0 0;
    width: 100%; max-width: 820px; max-height: 88%; overflow-y: auto;
    padding: 18px 16px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 -18px 50px -20px rgba(139,92,246,.45);
    animation: rise .22s ease-out;
  }
  @media (min-width: 900px) { .sheet-back { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line2); box-shadow: 0 18px 60px -20px rgba(139,92,246,.55); } }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet-top { display: flex; gap: 14px; align-items: flex-start; }
  .sheet-top .num { font-family: var(--serif); font-weight: 900; font-size: 46px; line-height: 1; color: var(--accent2); text-shadow: 0 0 24px rgba(139,92,246,.45); direction: ltr; unicode-bidi: isolate; }
  .sheet-top .ttl { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 24px; line-height: 1.25; text-wrap: balance; }
  .sheet-close { margin-inline-start: auto; background: var(--card3); border: 1px solid var(--line2); border-radius: 50%; width: 38px; height: 38px; cursor: pointer; flex: none; font-size: 18px; line-height: 1; }
  .sheet .ytasks { padding: 14px 12px 10px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  details.script summary, details.tasks-fold summary { cursor: pointer; font-weight: 700; color: var(--accent2); }
  .table-wrap { overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; }
  th, td { text-align: right; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.sec { color: var(--accent2); font-weight: 600; white-space: nowrap; direction: ltr; unicode-bidi: isolate; text-align: right; font-variant-numeric: tabular-nums; }
  .notes { margin: 10px 0 0; padding-inline-start: 18px; color: var(--muted); font-size: 14px; }
  .ep-tasks { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
  .ep-tasks h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 700; }
  ul.tasks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  ul.tasks li { border-bottom: 1px solid var(--line); }
  label.task { display: flex; gap: 12px; align-items: flex-start; padding: 10px 2px; cursor: pointer; }
  label.task input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  label.task .box { flex-basis: 22px; width: 22px; height: 22px; border-radius: 7px; }
  label.task .box svg { width: 14px; height: 14px; }
  .task-text { flex: 1; min-width: 0; }
  label.task input:checked ~ .task-text { color: var(--muted); text-decoration: line-through; }

  /* Links out of the episode sheet: the shooting script and the current cut in Drive */
  a.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .ep-links .meta { font-size: 12.5px; }
  .cut-mark { font-size: 11px; font-weight: 700; color: var(--accent2); border: 1px solid rgba(167,139,250,.35); border-radius: 999px; padding: 0 7px; margin-inline-start: 6px; white-space: nowrap; }

  /* Shooting script: its own page at #script-N. A table of everything, or one card per shot */
  body.sr-open { overflow: hidden; }
  .sr { position: fixed; inset: 0; z-index: 55; overflow-y: auto; overscroll-behavior: contain;
    background: radial-gradient(900px 500px at 85% -10%, rgba(139,92,246,.12), transparent 60%), var(--bg); }
  .sr-in { max-width: 920px; margin: 0 auto; padding: 14px 16px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
  .sr-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0;
    background: rgba(7,8,15,.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .sr-bar .sp { flex: 1; }
  .sr-head { display: flex; gap: 14px; align-items: flex-start; }
  .sr-head .num { font-family: var(--serif); font-weight: 900; font-size: 52px; line-height: 1; color: var(--accent2); text-shadow: 0 0 24px rgba(139,92,246,.45); direction: ltr; unicode-bidi: isolate; }
  .sr-head h1 { margin: 0; font-family: var(--serif); font-size: 26px; line-height: 1.25; text-wrap: balance; }
  .sr-head .meta { color: var(--muted); font-size: 14px; }
  .sr-draft { border: 1px solid rgba(251,146,60,.35); color: var(--orange); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
  .vtag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
  .vtag.cam { color: #fff; background: var(--accent); border-color: var(--accent); }
  .vtag.vo { color: var(--accent2); border-color: rgba(167,139,250,.45); }
  .sr-table { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .sr-table li { display: grid; grid-template-columns: 3ch 7ch 1.1fr 1fr; gap: 6px 14px; padding: 12px 2px; border-bottom: 1px solid var(--line); align-items: start; }
  .sr-table .i { color: var(--dim); font-weight: 700; font-variant-numeric: tabular-nums; }

  .peek {

const DATA = {"builtAt":"2026-10-03T10:04:37.058Z","categories":[{"key":"rec","name":"להקליט במחשב"},{"key":"shoot","name":"לצלם"},{"key":"prep","name":"להכין"},{"key":"edit","name":"עריכה"},{"key":"post","name":"פרסום"},{"key":"dev","name":"העברה לסוכן הפיתוח"}],"agents":[{"key":"meni","name":"מני","role":"מנהל הסדרה","group":"content"},{"key":"zumi","name":"זומי","role":"רגעים בסשני פיתוח","group":"content"},{"key":"gazi","name":"גזי","role":"עריכה סופית","group":"content"},{"key":"patish","name":"פטיש","role":"בודק את מה שמגיע מגרוק","group":"content"},{"key":"webby","name":"וובי","role":"האתר","group":"content"},{"key":"kodi","name":"קודי","role":"פיתוח","group":"dev"},{"key":"knubler","name":"קנובלר","role":"קריאייטיב ופרסום","group":"content","team":"grok"},{"key":"gadi","name":"גדי","role":"תסריטים וחומר","group":"content","team":"grok"},{"key":"noga","name":"נוגה","role":"עיצוב","group":"content","team":"grok"},{"key":"noa","name":"נועה","role":"סושיאל","group":"content","team":"grok"},{"key":"roi","name":"רועי","role":"טייקים ובדיקת עריכה","group":"content","team":"grok"}],"morning":{"date":"03.10.2026","items":["שלושה כללי סיפור חדשים נכנסו לכל הסדרה: בלי \"ואז\", נפילה אחת לפחות בכל פרק, והפתיחה היא ההפך של הסוף.","פטיש בדק את התסריטים של פרקים 0, 1 ו-2. אין פרט אישי. התיקונים נשלחו לגדי בהודעה אחת.","הכרעתי: בפרק 0 השורה \"בניתי אותו, והיו המון בעיות\" נשארת כמו שהוקלטה, כדי שלא יהיו שני \"אבל\" ברצף. נשארת להקלטה שורה אחת.","הכרעתי: בפרק 2 \"הסברתי לו\" נשאר, ונוספת כתובית עם שם ה-AI. בלי הקלטה חוזרת.","פרק 1: גזי מחכה לשתי השורות החדשות, ואז עושה גרסה אחת עם התיקונים של רועי.","גדי תיקן את התסריטים, ופטיש בדק סבב שני: 13 מתוך 15 תיקונים בוצעו. ארבעה קטנים נשלחו בחזרה, בלי סבב נוסף.","הכרעתי: בפרק 0, אם הסכום במסך החיוב נכלל בתשובה לניחוש של פרק 1, מטשטשים אותו. ההחלטה שלך על סכומים גלויים קדמה לשאלת הניחוש.","משימה חדשה מקנובלר: הקלטת מסך קצרה של גלילה בין מנועים בחנות, לנפילה בפרק 1.","פרק 1: טייק שאלת הניחוש עבר את פטיש. הקול נלקח מההקלטה הנפרדת, כי הקול של הטלפון בעומס. גדי קיבל את הטייק המומלץ.","הכרעת: בסוף פרק 1 עוברים מהחולצה לגופייה דרך כתובית הסקר. אין צילום נוסף.","חדר הבקרה עבר לגיטהאב. הוא עובד באותה מידה משני החשבונות שלך. הכתובת שמורה בקובץ הפרטי.","כדי לשמור מהאתר, מדביקים פעם אחת בכל דפדפן את מפתח הגישה. לשונית השיחה ירדה.","האתר הישן נשאר כגיבוי, עם הודעה שהוא עבר.","פרק 1, שוט 5: הסרטון נקי. גדי מתקן שני דברים: מספרי הזמנה בקובץ ההסבר, והזמנות ישנות בסוף הקטע.","קנובלר קיבל את הכתובת, ויכול לקרוא מהאתר.","הסדרה עברה לגרוק: גדי כותב ומצלם, קנובלר מנהל את הרשתות.","העריכה הסופית אצל גזי. אתה עורך בעצמך רק אם אין ברירה.","פרק 0 מחכה עד שיש כמה פרקים מוכנים ברזרבה. שורת הסיום: \"מה אתם רוצים שהוא ידע לעשות?\"","צליל חתימה: אין עדיין. אתה תיצור אחד בהמשך.","נשלחה לקנובלר שאלה: מי הצוות שלו, ומה רועי עושה מעכשיו.","לצוות יש שמות: מני, זומי, גזי, פטיש, וובי וקודי.","השרשרת רצה לבד: כל שלב מפעיל את הבא, ואתה שומע רק בסוף או על שאלת טעם.","חדר הבקרה נבנה מאפס: ארבע לשוניות, ומה שמחכה לך בראש.","פרק 0 מוכן, עם אפקטים קוליים וכתוביות חדשות. פטיש העביר אותו. לא עולה עד ששלושה פרקים מוכנים.","פרק 1: מני הכריע בנקודות הניסוח, קוצר בלי לשכתב, ופטיש העביר. אפשר לצלם את צילומי המסך. מחכות לך שתי שאלות: השאלה בסוף חוזרת על פרק 0, והצילום מ-23.09 לשוט 7 לא נמצא.","פרק 2: מוכן דף שאלות שיעזור לך לספר את הפרק.","פרקים 3 עד 6: השלדים תוקנו. פרק 6 מחכה להחלטה על השם."]},"todo":{"open":[{"text":"30.09: המשתמש חושש שהפרקים עד עכשיו לא מספיק מעניינים. פרקי ההכנה, 0 עד 2, בלי תקלה ובלי ניצחון. לחזור לזה אחרי פרק 3, הראשון עם פיתוח אמיתי.","done":false,"sub":[]},{"text":"איך מסיימים פרק: שאלה לצופים כמו היום, או פתיח לפרק הבא.","done":false,"sub":[]},{"text":"האם להציג תווית קבועה עם מספר הפרק לאורך כל הסרטון.","done":false,"sub":[]},{"text":"מה NIPO אומר בפעם הראשונה.","done":false,"sub":[]},{"text":"איזה שימוש יומיומי מראה את סדר היום, ואיפה הוא נכנס ברצף.","done":false,"sub":[]},{"text":"הפתיחה הקבועה. \"זה NIPO, הוא גר אצלי במחשב\" לא מדויקת, כי הוא יגור על הקיר.","done":false,"sub":[]},{"text":"שלדי תסריטים לשלבים 1 ו-2: נכתבו שבעה, פרקים 3 עד 9. המשפט החוזר עודכן בכולם. מחכים לאישור. חסר פרק על שמיעה ודיבור בקול, כי זה עוד לא בתוכנית העבודה.","done":false,"sub":[]},{"text":"סוכן יומי שכותב טיוטות תסריט לפי יומן הפיתוח. אתר המשימות עלה. הריצה היומית מחכה לכמה ימי שימוש באתר, ולאישור נפרד.","done":false,"sub":[]}]},"decisions":[{"date":"02.10.2026","text":"המוח של ניפו רץ בינתיים על המחשב בבית. בהמשך יוזמן מחשב קטן עם כרטיס מסך מובנה, במקום המוח הקטן שתוכנן","why":"בבדיקה, הקצב של המוח הקטן הרגיש איטי מדי. המחשב עם כרטיס המסך מהיר פי 4 עד 5. הפירוט: dev/docs/decisions/2026-10-02-local-nipo.md"},{"date":"02.10.2026","text":"מתחילים מניפו מקומי שמשוחח בעברית, ולא מבוט בטלגרם. הבוט נדחה להמשך, כגישה מהטלפון","why":"המשתמש רוצה לראות את ניפו עצמו קודם. הפירוט: dev/docs/decisions/2026-10-02-local-nipo.md"},{"date":"29.09.2026","text":"חדר הבקרה עובר לאתר ציבורי בגיטהאב, בכתובת שאי אפשר לנחש. הנתונים נשמרים שם כקבצים. הקשרים לא עוברים. האתר הישן נשאר כגיבוי. הכתובת רק בקובץ הפרטי","why":"מני רץ מחשבון מוזמן שאין לו גישה לנתונים של האתר הישן, והמשתמש רוצה גישה זהה משני החשבונות"},{"date":"28.09.2026","text":"מני מעביר בין הדרייב לחדר הבקרה לבד, שש פעמים ביום, גם בלי שיחה. חדר הבקרה נשאר פרטי","why":"הבוטים בגרוק לא יכולים לכתוב באתר גם בקישור פתוח, וקישור פתוח היה חושף שמות וסכומים"},{"date":"28.09.2026","text":"העריכה הסופית אצל גזי, עם HyperFrames. גדי כותב ומצלם. המשתמש עורך בעצמו רק אם אין ברירה. שורת הסיום של פרק 0 היא \"מה אתם רוצים שהוא ידע לעשות?\" גם בקריינות וגם בכתובית","why":"המשתמש אישר את ההחלטות שקנובלר רשם בשמו"},{"date":"28.09.2026","text":"~~העריכה אצל רועי בגרוק, גדי כותב ומצלם, גזי עושה פינישים.~~ הוחלף בשורה הבאה. פרק 0 מחכה עד שיש כמה פרקים ברזרבה","why":"המשתמש החליט אחרי ההעברה לגרוק"},{"date":"28.09.2026","text":"קנובלר מפרסם רק אחרי אישור של המשתמש בחדר הבקרה והודעה ממני","why":"שום דבר לא יוצא החוצה בלי שהמשתמש ראה"},{"date":"28.09.2026","text":"מני מתחבר לקנובלר דרך תיקייה משותפת בגוגל דרייב, בשני הכיוונים. המצב העדכני של כל פרק נשמר שם, ומני מעתיק לחדר הבקרה","why":"בלי חיבור בתשלום, וכל צד כותב רק בתיקייה שלו"},{"date":"28.09.2026","text":"התסריטים, הצילום והעריכה עוברים לגדי, והרשתות לקנובלר. שניהם בוטים בגרוק. מילי מבוטלת, זומי נשאר לרגעים בסשני פיתוח, גזי לפינישים, ופטיש בודק את מה שמגיע מגרוק","why":"המשתמש מעביר את כל הצד של הסושיאל לגרוק"},{"date":"27.09.2026","text":"שרשרת אוטונומית: כשיש שיחה פתוחה, כל שלב מפעיל את הבא עד הסוף. המשתמש שומע רק בסוף או על בחירת טעם וסגנון. מני מכריע בשינויי ניסוח ובפרט אישי","why":"המשתמש לא רוצה להעביר עבודה בין הסוכנים בעצמו"},{"date":"27.09.2026","text":"חדר הבקרה נבנה מאפס: ארבע לשוניות, פס הייצור ראשי ומעליו מה מחכה למשתמש. הקשרים ומצב הצילום ירדו בינתיים","why":"האתר היה עמוס וקשה למצוא בו דברים"},{"date":"27.09.2026","text":"האתר משמש גם כמערכת קשרים אישית: שאלות צופים, מותגים והזמנות. הוא משותף רק עם החשבונות של המשתמש, ויש בו מצב צילום שמסתיר שמות וסכומים","why":"לא לפספס אף שאלה של צופה, ולנהל הכל ממקום אחד מכל מחשב"},{"date":"27.09.2026","text":"בסשני פיתוח המסך מוקלט לבד, רק ברגעים מתוכננים. זומי מתכנן, קודי מפעיל, פטיש בודק, והמקור נמחק אחרי אישור","why":"המשתמש לא מקליט בעצמו, ובסוף נשאר רק חומר שמקדם את הסיפור"},{"date":"27.09.2026","text":"אתר הניהול בנוי כפס ייצור: כל שלב בשרשרת הוא עמדה, והפרקים זזים עליו","why":"רואים מיד איפה כל פרק עומד ומה מחכה למשתמש"},{"date":"27.09.2026","text":"הדמויות של הסוכנים הן רובוטים קטנים: אותו גוף, צבע ופנים קבועים לכל סוכן. מופיעים באתר ובסרטונים","why":"צוות אחד שמזוהה במבט, וכל אחד עדיין שונה. מתאים לסיפור על בניית עוזר"},{"date":"27.09.2026","text":"וובי, סוכן האתר, מצטרף לצוות של מני. כל הניהול עובר דרך חדר הבקרה: סטטוס של כל הסוכנים כולל קודי, הוראות למני ולקודי, אישורים ושיחה","why":"מקום אחד לדעת מה המצב ולתת הוראות, בלי לפתוח שיחה ולשאול"},{"date":"27.09.2026","text":"לכל סוכן יש שם: מני (מנהל), מילי (יצירת תוכן), זומי (צילום והקלטה), גזי (עריכה), פטיש (שופט), קודי (פיתוח). הם מופיעים בסרטונים כדמויות","why":"שמות קלילים שרומזים לתפקיד, קל לזכור מי עושה מה והצוות הופך לחלק מהסיפור"},{"date":"27.09.2026","text":"המתאם פונה ישירות לסוכן הפיתוח, וסוכן הפיתוח רק מציע. המשתמש מאשר לפני בנייה","why":"חוסך צעד, והפיתוח נשאר בשליטת המשתמש"},{"date":"27.09.2026","text":"הפצה ופרסום, מותג ודמות ומתאם מול הפיתוח נכנסים אחרי שפרק 0 עובר את כל השרשרת","why":"קל לזהות מה לא עובד כשמתחילים קטן"},{"date":"27.09.2026","text":"איכות לפני קצב. פרק שלא עומד ברף נדחה","why":"המטרה של הצוות היא פרק טוב יותר"},{"date":"27.09.2026","text":"השופט מתקן בלי לדווח, חוץ משינוי בניסוח של המשתמש ומשהו שיוצא החוצה. שני סבבים, ואז המנהל מכריע","why":"איכות בלי לעצור את המשתמש, והתסריט נשאר במילים שלו"},{"date":"27.09.2026","text":"סוכן התוכן מתפצל לצוות: מנהל, יצירת תוכן, צילום והקלטה, עריכה ושופט. המשתמש מדבר רק עם המנהל","why":"כל תחום מקבל תשומת לב משלו, ויש מי שבודק את כולם"},{"date":"26.09.2026","text":"המשפט החוזר מתחיל מפרק 1, ולא נכנס לפרק 0","why":"הוא סותר את \"המעט ידע שכבר צברתי\" שבפרק 0"},{"date":"26.09.2026","text":"כל חלק במפה שמתחיל לעבוד מוסיף טבעת סביב הדמות. שש טבעות. בינתיים בעריכה, בהמשך בדמות שעל הקיר","why":"הדמות והמפה מספרות את אותו סיפור, וכל הטבעות יחד הן סוף העונה"},{"date":"26.09.2026","text":"לכל פרק שתי שורות: על מה, ומה הצופה לוקח","why":"אם אי אפשר לכתוב אותן, הפרק לא מחזיק"},{"date":"26.09.2026","text":"פרק הזרוע נדחה לפרקים מאוחרים יותר, בלי מספר","why":"קודם עובדים עם זרוע קיימת. תכנון זרוע משלי יבוא בהמשך"},{"date":"26.09.2026","text":"לימוד תוכנת המידול והמארז הם פרק אחד (פרק 6)","why":"לימוד התוכנה לבד לא נותן לעוזר שום דבר חדש"},{"date":"26.09.2026","text":"הכנת הסביבה והבוט הם פרק אחד (פרק 3)","why":"הכנה לבד היא לא רגע מרגש. ההודעה הראשונה נותנת לה תוצאה"},{"date":"25.09.2026","text":"פרקים 0 עד 2 נבנים מחדש","why":"הם נכתבו לפי הכללים הישנים"},{"date":"25.09.2026","text":"המשתמש מספר את הפרק במילים שלו לפני שנכתב תסריט","why":"התסריטים לא הרגישו שלו"},{"date":"25.09.2026","text":"רוב הקול קריינות מעל עבודה. פנים רק לפתיחה ולתגובות","why":"דיבור משונן מול המצלמה נשמע מוקרא"},{"date":"25.09.2026","text":"אורך הפרק לפי הסיפור, עד דקה וחצי","why":"הערוצים שהם המודל ארוכים יותר, והאורך הקצר חנק את הסיפור"},{"date":"24.09.2026","text":"פרקי \"איך עשיתי את זה\" רק כשצופים שואלים","why":"הסדרה היא סיפור, וההסבר עונה לביקוש אמיתי"},{"date":"24.09.2026","text":"פרק אחד בשבוע","why":"קצב שאפשר לעמוד בו לצד הבנייה"},{"date":"24.09.2026","text":"העונה הראשונה: מוזיקה וסדר יום. הבית והלמידה בעונה הבאה","why":"מיקוד, כדי לא ללכת לאיבוד"},{"date":"24.09.2026","text":"גמר העונה: מיקס בפקודה קולית, כמו בפרק 0. העונה נגמרת כשזה עובד","why":"סוגר מעגל שכל צופה מבין"},{"date":"24.09.2026","text":"משפט חוזר: \"אפס ידע. אפס קוד. עוזר AI שהוא רק שלי.\"","why":"מחבר בין הלמידה מאפס לעצמאות של העוזר"},{"date":"24.09.2026","text":"המוח גר בבית ולא תלוי באף מוח חיצוני. האינטרנט רק ככלי, וגישה גם מהטלפון","why":"עצמאות היא המטרה, בלי לוותר על יכולות"},{"date":"24.09.2026","text":"לשמיעה ולדיבור משתמשים במיקרופון וברמקול שכבר קיימים","why":"לא מחכים להזמנה נוספת"},{"date":"24.09.2026","text":"NIPO שומע ועונה בקול, בעברית, בנוסף לשליטה בידיים","why":"עוזר שמדברים אליו. עלה בתכנון פרק 2"},{"date":"23.09.2026","text":"סוכן התוכן עובד בלי אישור מראש, חוץ מפעולות לא הפיכות","why":"טיוטות זולות לתיקון"},{"date":"23.09.2026","text":"החוסמים לצילום אצל סוכן התוכן","why":"הקלטה, צילום ועריכה הם עבודת תוכן"},{"date":"23.09.2026","text":"סוכן התוכן קורא את יומן הפיתוח ולא משנה אותו","why":"הוא צריך לדעת מה קרה, בלי לדרוס"},{"date":"23.09.2026","text":"שני סוכנים: תוכן ופיתוח, כל אחד בתיקייה משלו","why":"הפרדה בין העבודה על הסדרה לעבודה על העוזר"},{"date":"23.09.2026","text":"קבצי טקסט ולא אקסל","why":"נראים טוב בצילום, ורואים מה השתנה בכל שמירה"},{"date":"23.09.2026","text":"גיבוי בענן במאגר פרטי","why":"שום דבר לא אובד אם המחשב נופל"},{"date":"23.09.2026","text":"יומן הפיתוח מוכתב בסוף כל סשן, והסטטוסים מתעדכנים יחד איתו","why":"לא נשכח, ומקור אחד לאמת"},{"date":"23.09.2026","text":"כל קובץ בטוח למצלמה, פרטים אישיים בקובץ פרטי שלא עולה לענן","why":"לא צריך לטשטש בעריכה"},{"date":"23.09.2026","text":"קבצי הפרויקט בעברית","why":"הם מופיעים על המסך בסרטונים"},{"date":"23.09.2026","text":"עד שהמוח יגיע, הכל רץ על המחשב","why":"אין סיכון המתנה, המוח עוד לא הוזמן"}],"plan":[{"title":"שלב 1: הכנות תוכנה (לפני החלקים)","tasks":[{"id":"1.1","text":"סביבת פיתוח וחיבור לגיבוי בענן","days":"1","state":"progress","note":""},{"id":"1.2","text":"ניפו מקומי שמשוחח בעברית","days":"2-3","state":"done","note":""},{"id":"1.3","text":"זיהוי כף יד (MediaPipe)","days":"4-5","state":"todo","note":""},{"id":"1.4","text":"מודל שפה מקומי (Ollama) שמחזיר פקודות מובנות","days":"6-7","state":"todo","note":""}]},{"title":"שלב 2: תכנון ומידול (לפני החלקים)","tasks":[{"id":"2.1","text":"לימוד תוכנת מידול (Fusion 360)","days":"8","state":"todo","note":""},{"id":"2.2","text":"מארז לבסיס","days":"9-11","state":"todo","note":""},{"id":"2.3","text":"איסוף מודלים לזרוע","days":"12","state":"todo","note":""}]},{"title":"שלב 3: הפעלת המוח (אחרי החלקים)","tasks":[{"id":"3.1","text":"מערכת הפעלה על המוח","days":"13","state":"blocked","note":"מחכה למחשב הקטן עם כרטיס המסך. בינתיים המוח רץ על המחשב"},{"id":"3.2","text":"העברת התוכנות למוח","days":"14","state":"blocked","note":""},{"id":"3.3","text":"בדיקת מצלמה ומקרן","days":"15","state":"blocked","note":""}]},{"title":"שלב 4: אלקטרוניקה ותנועה","tasks":[{"id":"4.1","text":"מעגל ראשון","days":"16","state":"todo","note":"החלקים הגיעו 01.10"},{"id":"4.2","text":"תנועה ראשונה","days":"17","state":"blocked","note":""},{"id":"4.3","text":"תקשורת אלחוטית","days":"18-19","state":"blocked","note":""}]},{"title":"שלב 5: הרכבה ואינטגרציה","tasks":[{"id":"5.1","text":"הדפסה והרכבה","days":"20-24","state":"blocked","note":""},{"id":"5.2","text":"אינטגרציה מלאה","days":"25-28","state":"blocked","note":""},{"id":"5.3","text":"כיולים","days":"29-30","state":"blocked","note":""}]}],"journal":[{"date":"02.10.2026","items":["השינוי בתוכנית: במקום בוט בטלגרם, התחלנו מניפו מקומי שמשוחח בעברית. הבוט נדחה להמשך, כדרך לדבר עם ניפו מהטלפון.","נבנה: חלון במסך מלא עם הכדור הסגול מהלוגו. הוא נושם כשהוא מחכה, זוהר כשהוא חושב וזז כשהוא עונה. מקלידים לו, והתשובה מופיעה מילה אחרי מילה. בלי אינטרנט, ושום דבר לא נשמר.","נבנה: סמל בשולחן העבודה. לחיצה כפולה, וניפו נפתח במסך השני.","בחירת המוח: שלושה מוחות קטנים ענו על אותן 5 שאלות. המשתמש בחר במוח של גוגל.","נתקע: בהשוואה הראשונה הכלי קרס, כי מוח אחד שילב פרצוף מחייך בתשובה. תוקן, וההשוואה רצה מחדש.","נתקע: המוח של גוגל שכח מה אמרו לו, ארבע פעמים מתוך ארבע. התברר שההוראה \"אל תמציא\" גרמה לו לסרב גם כשהתשובה הייתה בשיחה. שורה אחת באופי, \"אתה זוכר את כל מה שנאמר בשיחה\", פתרה את זה.","נתקע: בשיחה הראשונה ניפו נפתח במסך שלא מוקלט. תוקן.","השיחה הראשונה: הזיכרון והכנות עבדו. מספרים, בדיחות ושעה נכשלו: 100 ועוד 105 יצא 125.","התיקון: קיבל את השעון של המחשב, מספרים בספרות, ומוח גדול יותר. בסבב השני הוא חישב נכון ודיבר עברית תקינה.","עבד: המבחן החוזר עבר.","בדיקת קצב: ניפו ענה בקצב שנמדד למוח הקטן, משפט בכ-15 שניות. במילים של המשתמש: \"זה הרגיש לאגי רצח\".","הוחלט: המוח נשאר בינתיים על המחשב. בהמשך יוזמן מחשב קטן עם כרטיס מסך מובנה, והמוח יעבור אליו. את המוח הקטן שתוכנן לא קונים.","לקח לרגעים: ההשוואות בין המוחות רצו ברקע, ולכן הקטעים ח1, ח2, ח3 ו-ח5 מראים רק חלון סטטי. תוצאה שרוצים לצלם צריכה להופיע בחלון גלוי על המסך המוקלט.","רגעים שהוקלטו:"]},{"date":"23.09.2026","items":["נפתח הבית של הפרויקט: יומן, מעקב פרקים, תוכנית עבודה, החלטות וחוסמים.","הפרויקט חולק לשני סוכנים: תוכן ופיתוח, כל אחד בתיקייה משלו.","הוחלט: עד שהמוח יגיע, הכל רץ על המחשב.","הוחלט: הקבצים בעברית, וכולם בטוחים למצלמה.","הסוכן הלילי נדחה עד שיצטבר יומן.","הסשן צולם.","נתקע: אב הטיפוס עוד לא הוקלט. בלי זה אין פרק 0."]}],"production":{"0":{"shots":null,"shotStates":[],"shootSheet":false,"editPackage":false},"1":{"shots":9,"shotStates":[{"id":"1","state":"done"},{"id":"2","state":"done"},{"id":"3","state":"done"},{"id":"4","state":"done"},{"id":"5","state":"progress"},{"id":"6","state":"done"},{"id":"7","state":"progress"},{"id":"8","state":"done"},{"id":"9","state":"done"},{"id":"ק1","state":"progress"},{"id":"ק2","state":"progress"},{"id":"ק3","state":"progress"},{"id":"ק4","state":"done"},{"id":"ק5"," ","say":"\"עד שהחלקים יגיעו, נתחיל לעבוד על התוכנה.\"","see":"הצילום מסשן הפיתוח של 23.09: נפתח הבית של הפרויקט. מראים רק מה שרואים בהקלטה, מואץ"},{"sec":"32-40","voice":"cam","say":"\"אפס ידע. אפס קוד. עוזר AI שהוא רק שלי. כמה אתם חושבים שהוצאתי עד עכשיו על הפרויקט?\"","see":"פנים. כתובית: כמה אתם חושבים שהוצאתי עד עכשיו על הפרויקט? פחות מ-₪300 / ₪300–700 / ₪701–1,500 / יותר מ-₪1,500"}]},"3":{"draft":true,"duration":"כ-50 שניות","captions":"שלחתי לו / הודעה / והוא ענה","rows":[{"sec":"0-3","voice":"vo","say":"\"שלחתי לו הודעה. והוא ענה.\" (הצעה, מחכה לסיפור)","see":"הטלפון, התראה מ-NIPO. צליל חתימה"},{"sec":"3-8","voice":"vo","say":"\"אבל כשהתחלתי, היה לו רק בית. בלי כלים.\" (הצעה, מחכה לסיפור)","see":"הבית של הפרויקט מסוף פרק 1, מהצילום של 23.09: קבצי תכנון, עוד בלי כלים ובלי בוט"},{"sec":"8-15","voice":"vo","say":"הבעיה: מה נתקע בהתקנת הכלים ובבוט. מהיומן","see":"המסך"},{"sec":"15-30","voice":"vo","say":"התיקון בשלושה שוטים: ה-AI מתקין, הבוט נבנה, ההודעה הראשונה נשלחת","see":"הקלטת מסך מהסשנים, מואצת. שנייה או שתיים: הקבצים שמורים בענן, שמות הקבצים בעברית ואין בהם מידע אישי"},{"sec":"30-42","voice":"vo","say":"התוצאה: שולח לו הודעה בטלפון, והוא עונה. בשלב הזה זה בוט בסיסי, עוד בלי מוח. מה בדיוק הוא עונה - מהיומן","see":"הטלפון ביד, בלי חיתוך"},{"sec":"42-50","voice":"cam","say":"\"אפס ידע. אפס קוד. עוזר AI שהוא רק שלי.\" ואז \"מה הייתם כותבים לו ראשון?\" (השאלה: הצעה, מחכה לסיפור)","see":"פנים"}]},"4":{"draft":true,"duration":"כ-40 שניות","captions":"הוא רואה / את היד / שלי","rows":[{"sec":"0-3","voice":"vo","say":"\"הוא רואה את היד שלי.\" (הצעה, מחכה לסיפור)","see":"יד מול המצלמה, נקודות סגולות על האצבעות"},{"sec":"3-10","voice":"vo","say":"הבעיה: מה בלבל אותו. מהיומן. למשל אור, רקע, שתי ידיים (דוגמה בלבד, עד שיופיע ביומן)","see":"המסך"},{"sec":"10-25","voice":"vo","say":"התיקון בשלושה שוטים","see":"הקלטת מסך, ומולה היד"},{"sec":"25-33","voice":"vo","say":"התוצאה: מזיז יד, הנקודות עוקבות","see":"מסך מפוצל: יד אמיתית ומה שהוא רואה. צליל חתימה כשהנקודות עוקבות"},{"sec":"33-40","voice":"cam","say":"\"אפס ידע. אפס קוד. עוזר AI שהוא רק שלי.\" ואז \"איזו תנועה הייתם מלמדים אותו?\" (השאלה: הצעה, מחכה לסיפור)","see":"פנים. מסמן בסגול על המפה: רואה ידיים. טבעת חדשה סביב הדמות: רואה, רק אם זה עובד מול המצלמה"}]},"5":{"draft":true,"duration":"כ-45 שניות","captions":"נתתי לו מוח / בלי אינטרנט / בינתיים במחשב","rows":[{"sec":"0-3","voice":"vo","say":"\"ניתקתי את האינטרנט. והוא עדיין חושב.\" (הצעה, מחכה לסיפור. מנוסחת כמו שם הפרק)","see":"מנתק את הרשת מול המצלמה, ואז מקליד לו שאלה קצרה. צליל חתימה כשהתשובה מגיעה בלי אינטרנט"},{"sec":"3-10","voice":"vo","say":"הבעיה: מקום שמור לבעיה אמיתית מהיומן","see":"לפי הבעיה, מהיומן"},{"sec":"10-28","voice":"vo","say":"התיקון בשלושה שוטים: מה נתקע ואיך נפתר. מהיומן","see":"הקלטת מסך מהסשן"},{"sec":"28-38","voice":"vo","say":"התוצאה: אומר לו משהו רגיל, והוא מחזיר פקודה. מסבירים במילים פשוטות מה הפקודה הייתה עושה","see":"המסך. המילים החשובות בסגול, ולידן כתובית במילים פשוטות"},{"sec":"38-45","voice":"cam","say":"\"אפס ידע. אפס קוד. עוזר AI שהוא רק שלי.\" ואז \"מה הדבר הראשון שהייתם מבקשים ממנו?\" (השאלה: הצעה, מחכה לסיפור)","see":"פנים. מסמן בסגול על המפה: חושב. טבעת חדשה סביב הדמות: חושב"}]},"6":{"draft":true,"duration":"כ-50 שניות","captions":"אני לא יודע לצייר / אז תכננתי לו / גוף","rows":[{"sec":"0-3","voice":"vo","say":"\"אני לא יודע לצייר קו ישר. וזה הגוף שלו.\" (הצעה, מחכה לסיפור)","see":"המארז מסתובב על המסך"},{"sec":"3-18","voice":"vo","say":"הבעיה: תוכנה שנראית כמו תא טייס, הניסיון הראשון בה, ומה לא עבד. מהיומן","see":"המסך המלא בכפתורים, ואז הקלטת מסך של הניסיון הראשון"},{"sec":"18-33","voice":"vo","say":"התיקון בשלושה שוטים: שואל את ה-AI, מנסה, מתקן. כולל מה לא נכנס במארז. מהיומן","see":"הקלטת מסך, מואצת"},{"sec":"33-42","voice":"vo","say":"התוצאה: המארז המלא, מכל הכיוונים","see":"המודל מסתובב על המסך. ואז מחשב נייד או מסך עם המודל, ליד המפה על הקיר. לא מודפס. צליל חתימה כשהמארז מוכן"},{"sec":"42-50","voice":"cam","say":"\"אפס ידע. אפס קוד. עוזר AI שהוא רק שלי.\" ואז \"איך אתם הייתם רוצים שהוא ייראה?\" (השאלה: הצעה, מחכה לסיפור)","see":"פנים"}]}},"episodes":[{"id":"0","title":"זה כמעט עבד. אז מחקתי הכל","rows":[["0-2","קריינות: \"אני מפתח עוזר AI משלי.\"","התופים נוצרים ומתנגנים, מואץ. כתוביות הפתיחה"],["2-5","קריינות: \"בסוף, כשסיימתי לעבוד עליו, הוא עבד בסדר.\"","התופים ממשיכים"],["5-8","קריינות: \"אבל היו המון בעיות בדרך, שלא הצלחתי לפתור.\"","הריוורב שנכנס לבד. כתובית: לא ביקשתי ריוורב"],["8-14","קריינות: \"אבל ברגע שביקשתי ממנו לבצע הכנה למיקס, הוא רשם לי \"מבצע\". ובפועל, לא קרה כלום.\"","הבקשה למיקס. שעון המתנה רץ בפינה. המוזיקה נעצרת על \"לא קרה כלום\""],["14-19","קריינות: \"אז החלטתי להעיף את העוזר, ולהתחיל את הכל מאפס, עם הידע שכבר צברתי.\"","מחיקת התיקייה. הכל מטושטש חוץ מחלון האישור"],["19-21","מול המצלמה: \"אבל אני לא מסתפק רק בזה.\"","פנים"],["21-28","קריינות: \"אני לא רוצה שהוא יהיה תלוי באף מערכת AI אחרת, כי זה עולה המון כסף, שלא ממש בא לי להוציא.\"","עיגול סגול נדלק, והמוזיקה חוזרת. מסך החיוב, שם ופרטי משתמש מטושטשים. חלונות של צ'אט נסגרים, רשימת השיחות מטושטשת"],["28-30","קריינות: \"תכירו את ניפו. העוזר האישי שלי.\"","חשיפת הלוגו בסגול, פרק 00"],["30-33","מול המצלמה: \"מה אתם רוצים שהוא ידע לעשות?\"","פנים. כתובית: מה הוא ילמד קודם?"]],"notes":["על מה: בניתי עוזר שכמעט עבד, והוא נכשל ברגע האמת. אז מחקתי הכל ואני מתחיל מאפס, והפעם מצלם.","מה הצופה לוקח: \"כמעט עובד\" זה לא עובד. ולפעמים עדיף להתחיל מחדש מאשר לתקן.","הגרסה שיצאה, 27.09.2026. הטקסט שהמשתמש הקליט ברצף אחד, לפי דף הקריינות בתיקיית הפרק. הניסוח שלו. רק קוצר.","ירדו מהטקסט המוקלט: \"ישבתי וחשבתי\", המטרה העיקרית, איך הוא נבנה, \"לצורך העניין, ניסיתי ללמד אותו\", ו\"החלטתי לפתח אותו מחדש\".","הסיום: שאלה לצופים, בלי המשפט החוזר. המשפט החוזר מתחיל מפרק 1.","רשת: אינסטגרם.","### החלטות 27.09.2026","הגרסה הסופית היא ייצוא/episode-00.mp4 בתיקיית הפרק. בתיקיית renders של הגרפיקה יש קובץ דומה, והוא לא הגרסה הסופית.","הפרק נערך קודם לפי התסריט הארוך, לא לפי הישן. בחומר הגלם הישן זה נשמע קרוא מדף, והאנרגיה נמוכה.","מהצילום של 23.09 נשארות רק הקלטות המסך. כל הפנים מצולמות מחדש.","סשן הצילום: קודם קוראים את התסריט בקול ומסמנים שורות שלא נשמעות טבעיות. אחר כך שיחה מול המצלמה: דף שאלות על מסך ליד המצלמה, עונים במילים שלי, כל שאלה כמה פעמים. בעמידה, אחרי חימום קצר.","בסשן הראשון רק קול ופנים. הקלטות המסך החסרות אחר כך.","מבחן: רצף קול בלבד. אם הסיפור עובד בשמיעה, ממשיכים לתמונה.","במסך החיוב הסכומים גלויים. מטושטשים רק השם ופרטי המשתמש. המשתמש החליט, 27.09.","הפרק נערך מחדש לגרסה של כ-33 שניות. הגרסה של 66 שניות הרגישה משעממת: יותר מדי סיפור על העבר מעל מסכים סטטיים. הארוכה שמורה בארכיון של תיקיית הגרפיקה.","מוזיקת רקע: קטע חופשי מפיקסביי, \"טכנולוגיה יצירתית\", לא רשום במערכת זיהוי זכויות. הרישיון שמור ליד הקובץ. נעצרת על \"לא קרה כלום\" וחוזרת עם העיגול הסגול.","הקריינות מוקלטת מחדש ברצף אחד מהטקסט הסופי, כי הרצף מתשובות נפרדות לא נשמע חלק. שוטי הפנים נשארים.","הגרפיקה מוכנה בתיקיית הגרפיקה של הפרק, ומוקפאת עד אחרי העריכה: כתוביות פתיחה, \"לא ביקשתי ריוורב\", שעון המתנה, עיגול וחשיפת לוגו, שאלת הסיום ושער.","סבב הערות של המשתמש, 27.09 בערב. הגרסה הסופית בתיקיית הייצוא היא בדיוק הטיוטה שהמשתמש שמע ואישר. הגרסה הקודמת והפרויקט שלפני השינוי שמורים בארכיון העריכה, בתיקייה v33-before-sfx.","אפקטים קוליים מספרייה חינמית, ברישיון נחלת הכלל. קובץ רישיון ליד כל אפקט בתיקיית הסאונדים של הפרק. כל מכה נכנסת לשקט בקריינות, אף אחת לא על מילה. בלוגו אין צליל.","השעון: צליל סוחף עולה מתחת לקול משנייה 8.7, תקתוקים בין המילים, ובאזר של תשובה לא נכונה ב-12.8, יחד עם עצירת המוזיקה. השעון נעצר על 4:37 והנקודה מאדימה. צליל השגיאה שונה מצליל החתימה, ולא סוגר את השאלה \"מה נשמע כשהוא תקוע\".","צליל הדלקה לעיגול הסגול בשנייה 21. המשתמש אישר.","כתוביות: שורה אחת, גדולות יותר, בלי רקע, קו מתאר שחור וצל, ומילה אחת בסגול בכל כתובית. בפתיחה רק כתוביות הפתיחה. בחשיפת הלוגו הכתובית ממורכזת.","שאלת הסיום מציגה את מה שנאמר: \"מה אתם רוצים שהוא ידע לעשות?\"","שורת המשימות, עם התאריך והשעה, מטושטשת בשלושה מקומות.","השם הישן של אב הטיפוס לא מופיע בפרק. המשתמש צפה ואישר.","פטיש העביר את הפרק בסבב השני. בחשיפת הלוגו הכתוביות עלו מהאזור שאינסטגרם מכסה: \"תכירו את ניפו\" בגובה של שאר edit-4","cat":"edit","text":"לטשטש בצילום של סשן 23.09: נתיבים עם שם המשתמש, התראות, וכל אזכור של השם הישן של אב הטיפוס","done":false},{"id":"e1-edit-5","cat":"edit","text":"מילות החלקים בסגול","done":false},{"id":"e1-edit-6","cat":"edit","text":"ריבוע ריק עם סימן שאלה במקום המוח, עם הכתובית \"המוח\"","done":false},{"id":"e1-edit-7","cat":"edit","text":"ארבע הבדיקות לפני ייצוא","done":false},{"id":"e1-post-1","cat":"post","text":"שער","done":true},{"id":"e1-post-2","cat":"post","text":"כיתוב לפוסט","done":false}],"duration":"כ-37 שניות","captions":"אין לי מושג / באלקטרוניקה","cover":"הרובוט המצויר בטוש, \"אני בונה עוזר AI\", פרק 1. אושר 28.09, בדרייב","caption":"הזמנתי חלקים לרובוט, ואין לי מושג באלקטרוניקה. עד שהם יגיעו, מתחילים מהתוכנה. מה הדבר הראשון שהוא צריך לדעת לעשות? #NIPO #AI #בינה_מלאכותית","status":{"script":{"state":"progress","label":"טיוטה מהסיפור"},"shot":{"state":"progress","label":"פנים וקריינות. חסרים מסכים"},"edited":{"state":"todo","label":""},"posted":{"state":"todo","label":""}},"stage":"shoot"},{"id":"2","title":"ממה בכלל בנוי עוזר AI?","rows":[["0-3","\"ממה בכלל בנוי עוזר AI? גם אני לא ידעתי.\"","דף לבן ריק על הקיר. יד עם טוש נכנסת לפריים"],["3-7","\"אז ביקשתי מה-AI להסביר לי. מא' ועד ת'.\"","פנים"],["7-11","\"קודם כל, הוא צריך לשמוע אותי.\"","מצייר אוזן, כותב: שומע"],["11-15","\"ואז לחשוב. זה המוח. מחשב קטן, שעוד לא הזמנתי.\"","מצייר ריבוע, כותב: חושב. סימן שאלה לידו"],["15-19","\"ואז לענות לי. בקול. בעברית.\"","מצייר פה, כותב: עונה. חץ מ\"חושב\""],["19-23","\"הוא צריך לראות את הידיים שלי...\"","מצייר עין, כותב: רואה ידיים"],["23-27","\"...להופיע על הקיר הזה...\"","מצביע על הקיר סביב הדף, כותב: מופיע על הקיר"],["27-31","\"...ולהזיז יד. יד אמיתית. וזה החלק שהכי מפחיד אותי.\"","מצייר זרוע, כותב: זז. חיתוך לפנים"],["31-36","\"והמוח שלו אמור לגור אצלי בבית. לא אצל אף אחד אחר.\"","מתרחקים: המפה המלאה על הקיר"],["36-45","\"אפס ידע. אפס קוד. עוזר AI שהוא רק שלי. מאיזה חלק אתם הייתם מתחילים?\"","פנים ליד המפה. כתובית: מאיזה חלק מתחילים?"]],"notes":["על מה: ציירתי על הקיר את המפה של העוזר: שומע, חושב, עונה, רואה, מופיע על הקיר וזז.","מה הצופה לוקח: עוזר כזה הוא לא קסם אחד. הוא כמה חלקים פשוטים שמחוברים יחד.","> תסריט ישן, לפי הכללים הישנים. נשאר כחומר עזר עד שייכתב תסריט חדש. לא למחוק.","מצלמים על דף גדול שתלוי על הקיר הריק, הקיר ש-NIPO יוקרן עליו. מציירים בטוש שחור בזמן שמדברים, ובעריכה מאיצים.","הטוש הסגול שמור לפרקים הבאים: כל יכולת שמתחילה לעבוד מסומנת בסגול. המפה נשארת על הקיר כל העונה.","אם הפרק ארוך מדי, יורד ראשון המשפט על הפחד מהיד.","\"גר אצלי בבית\" מנוסח כמטרה (\"אמור\"), כי עוד לא נבדק.","המפה הזו חוזרת בגמר: אני מסביר אותה לבד, בלי עזרה. לשמור את הדף.","לוודא לפני צילום: שהמפה באמת נבנתה משיחה עם ה-AI.","באותו סשן: לצלם את הקיר הריק ואת השולחן הריק, תמונות ה\"לפני\" של העונה.","### שאלות לסיפור","עונים במילים שלך, כמו שהיית מספר לחבר. אין תשובה לא נכונה, ומותר לענות כמה פעמים.","1. אם היו לך שלוש שניות לתפוס מישהו שגולל, מה היית אומר לו על הפרק הזה?","2. לפני שהתחלת, מה חשבת שיש בתוך עוזר כזה? מה לא ידעת?","3. איך התחילה השיחה עם ה-AI? מה שאלת אותו, בערך במילים שלך?","4. איך מהשיחה הזאת יצאה המפה? מה הוא הציע, ומה אתה הוספת או שינית?","5. מה הפתיע אותך כשראית את כל החלקים ביחד?","6. איזה חלק הכי מפחיד אותך, ולמה דווקא הוא?","7. למה דווקא הקיר הזה? מה אתה רואה כשאתה מסתכל עליו ריק?","8. כשהמפה תלויה על הקיר, מה השתנה אצלך לעומת היום שבו התחלת?","9. מה היית רוצה לשאול את מי שצופה בסוף?"],"tasks":[{"id":"e2-prep-1","cat":"prep","text":"המשתמש מספר את הפרק במילים שלו","done":false},{"id":"e2-prep-2","cat":"prep","text":"דף גדול, טוש שחור וטוש סגול","done":false},{"id":"e2-prep-3","cat":"prep","text":"לתלות את הדף על הקיר הריק","done":false},{"id":"e2-prep-4","cat":"prep","text":"לוודא שהמפה באמת נבנתה משיחה עם ה-AI","done":false},{"id":"e2-shoot-1","cat":"shoot","text":"הקיר הריק והשולחן הריק, לפני שתולים את הדף","done":false},{"id":"e2-shoot-2","cat":"shoot","text":"ציור המפה בזמן הדיבור, שוט לכל שורה","done":false},{"id":"e2-shoot-3","cat":"shoot","text":"פנים: \"אז ביקשתי מה-AI להסביר לי\"","done":false},{"id":"e2-shoot-4","cat":"shoot","text":"שוט רחב של המפה המלאה","done":false},{"id":"e2-shoot-5","cat":"shoot","text":"פנים ליד המפה: השאלה לצופים","done":false},{"id":"e2-edit-1","cat":"edit","text":"להאיץ את הציור","done":false},{"id":"e2-edit-2","cat":"edit","text":"ארבע הבדיקות לפני ייצוא","done":false},{"id":"e2-post-1","cat":"post","text":"שער: הרובוט עם מוח סגול. אושר 28.09","done":true},{"id":"e2-post-2","cat":"post","text":"כיתוב לפוסט","done":false},{"id":"e2-dev-1","cat":"dev","text":"NIPO שומע ועונה בקול, בעברית, עם המיקרופון והרמקול הקיימים. המוח בבית, בלי תלות במוח חיצוני","done":false}],"duration":"כ-45 שניות","captions":"ממה בנוי / עוזר AI? / גם אני לא ידעתי","cover":"הרובוט המצויר בטוש עם מוח סגול, \"אני בונה עוזר AI\", פרק 2. אושר 28.09, בדרייב","caption":"ממה בנוי עוזר AI? ציירתי את זה על הקיר שהוא יגור עליו. כל חלק שיתחיל לעבוד יסומן בסגול. מאיזה חלק אתם הייתם מתחילים? #NIPO #AI #בינה_מלאכותית","status":{"script":{"state":"progress","label":"נבנה מחדש"},"shot":{"state":"todo","label":""},"edited":{"state":"todo","label":""},"posted":{"state":"todo","label":""}},"stage":"story"},{"id":"3","title":"שלחתי לו הודעה. הוא ענה.","rows":[["0-3","קריינות: \"שלחתי לו הודעה. והוא ענה.\" (הצעה, מחכה לסיפור)","הטלפון, התראה מ-NIPO. צליל חתימה"],["3-8","קריינות: \"אבל כשהתחלתי, היה לו רק בית. בלי כלים.\" (הצעה, מחכה לסיפור)","הבית של הפרויקט מסוף פרק 1, מהצילום של 23.09: קבצי תכנון, עוד בלי כלים ובלי בוט"],["8-15","קריינות: הבעיה: מה נתקע בהתקנת הכלים ובבוט. מהיומן","המסך"],["15-30","קריינות: התיקון בשלושה שוטים: ה-AI מתקין, הבוט נבנה, ההודעה הראשונה נשלחת","הקלטת מסך מהסשנים, מואצת. שנייה או שתיים: הקבצים שמורים בענן, שמות הקבצים בעברית ואין בהם מידע אישי"],["30-42","קריינות: התוצאה: שולח לו הודעה בטלפון, והוא עונה. בשלב הזה זה בוט בסיסי, עוד בלי מוח. מה בדיוק הוא עונה - מהיומן","הטלפון ביד, בלי חיתוך"],["42-50","מול המצלמה: \"אפס ידע. אפס קוד. עוזר AI שהוא רק שלי.\" ואז \"מה הייתם כותבים לו ראשון?\" (השאלה: הצעה, מחכה לסיפור)","פנים"]],"notes":["על מה: התקנתי לו כלים, ושלחתי לו הודעה ראשונה. והוא ענה.","מה הצופה לוקח: גם בלי לדעת מה מתקינים, אפשר להגיע לעוזר שעונה לך בטלפון.","שלד. משימות 1.1 ו-1.2 בתוכנית: הכנת הסביבה ובוט בטלגרם. לפי יומן הפיתוח, הסשן של 23.09 צולם: נפתח בו הבית של הפרויקט, והוא חולק לשני סוכנים. התקנת כלים לא מופיעה בו, אז את ההתקנה מצלמים כשהיא קורית.","אם נתקע: \"שלחתי לו הודעה. שעה. שום דבר.\" (הצעה, מחכה לסיפור)","בלי טבעת. הודעה כתובה היא לא דיבור. הטבעת \"עונה\" מחכה לפרק הקול.","לפני שמתכננים את שוט ההתקנה: לבדוק עם קודי מה עוד נשאר להתקין. משימה 1.1 עדיין בעבודה.","התוצאה: לפי תוכנית העבודה, בשלב הזה הבוט בסיסי, והמוח מגיע רק בפרק 5. אם התשובה באה ממוח חיצוני, זה מתנגש בקו העצמאות. לברר עם קודי לפני הצילום.","לצנזר: מספר טלפון, שם משתמש, אנשי קשר, מפתח הגישה של הבוט, נתיבים עם שם המשתמש, שם החשבון והמאגר בענן, מייל, וכתובת אתר המשימות אם הוא נכנס לשוט.","הקבצים בעברית ובלי מידע אישי, וזה בכוונה. מראים את זה בשוט הקבצים בענן.","רעיון לשוט: אתר המשימות הזה. גם אותו אף אחד לא כתב בקוד."],"tasks":[{"id":"e3-prep-1","cat":"prep","text":"המשתמש מספר את הפרק במילים שלו","done":false},{"id":"e3-prep-2","cat":"prep","text":"לבדוק עם קודי מה עוד נשאר להתקין, לפני שמתכננים את שוט ההתקנה","done":false},{"id":"e3-prep-3","cat":"prep","text":"להשתיק בטלפון כל התראה חוץ מ-NIPO, ולבדוק מה רואים במסך הנעילה","done":false},{"id":"e3-rec-1","cat":"rec","text":"את סשן התקנת הכלים, מההתחלה","done":false},{"id":"e3-rec-2","cat":"rec","text":"שנייה או שתיים: הקבצים שמורים בענן, שמות בעברית ובלי מידע אישי","done":false},{"id":"e3-rec-3","cat":"rec","text":"את הסשן של בניית הבוט","done":false},{"id":"e3-rec-4","cat":"rec","text":"את ההודעה הראשונה שעובדת, גם בצד של המחשב","done":false},{"id":"e3-shoot-1","cat":"shoot","text":"הטלפון מקבל את ההתראה הראשונה, עם צליל","done":false},{"id":"e3-shoot-2","cat":"shoot","text":"הודעה ותשובה בטלפון, בשוט אחד","done":false},{"id":"e3-shoot-3","cat":"shoot","text":"פנים: הפתיחה והסיום","done":false},{"id":"e3-edit-1","cat":"edit","text":"לצנזר מספר טלפון, שם משתמש ואנשי function robot(key, size = 40, opts = {}) {
  const r = ROBOTS[key];
  if (!r) return "";
  const c = r.color;
  const cls = ["robot", opts.busy ? "busy" : ""].join(" ");
  return `<svg class="${cls}" viewBox="0 0 48 58" width="${size}" height="${Math.round(size * 58 / 48)}" role="img" aria-label="${esc(agentByKey[key]?.name || key)}">
    <path d="M24 4v8" stroke="${c}" stroke-width="2.5"${r.grok ? ` stroke-dasharray="2 1.6"` : ""}/>
    <circle class="bulb" cx="24" cy="5" r="3.5" fill="${c}"/>
    <rect x="4" y="12" width="40" height="28" rx="8" fill="#15131D" stroke="${c}" stroke-width="2.5"/>
    ${r.face(c)}
    <path d="M12 42h24v8a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6z" fill="#15131D" stroke="${c}" stroke-width="2.5"/>
    <g transform="translate(24 48.5)">${r.glyph(c)}</g>
  </svg>`;
}
// The rest of the team in Grok has no robots: a shared dashed ring with the first letter.
const isGrok = key => agentByKey[key]?.team === "grok";
function gmark(key, size = 26) {
  const name = agentByKey[key]?.name || key;
