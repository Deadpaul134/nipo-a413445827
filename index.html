<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Public but unlisted: keep it out of search engines, and never send the address to other sites. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07080f">
<title>NIPO לוח צילום</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307080f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%238B5CF6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;600;700;800&display=swap">
<!-- Only the four glyphs Kodi's robot face draws, so the robot stays exactly as drawn. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&text=%3E_%3C%2F&display=swap">
<style>
  /* Same tokens as the tasks page, one to one, so both feel like one system. Single dark look. */
  :root {
    color-scheme: dark;
    --bg: #07080f; --bg2: #0b0d18; --card: #0f1220; --card2: #141829; --card3: #191e33;
    --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.12);
    --text: #eef0f8; --muted: #8b90a8; --dim: #5d6280;
    --accent: #8B5CF6; --accent2: #A78BFA; --accent-soft: rgba(139,92,246,.16);
    --green: #34d399; --violet: #d08cff; --orange: #fb923c; --blue: #60a5fa;
    --red: #f87171;
    --grok: #D9D4E7;
    --warn: var(--orange); --ok: var(--green); --bad: var(--red);
    --sans: "Heebo", "Rubik", "IBM Plex Sans Hebrew", "Assistant", "Segoe UI", "Arial Hebrew", -apple-system, BlinkMacSystemFont, "Noto Sans Hebrew", Roboto, Arial, sans-serif;
    --serif: "Frank Ruhl Libre", "David Libre", "Noto Serif Hebrew", "Taamey Frank CLM", "David", "Times New Roman", Georgia, serif;
    --tabbar: 68px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  [hidden] { display: none !important; }
  body {
    font-family: var(--sans); font-size: 16px; line-height: 1.55; direction: rtl; -webkit-font-smoothing: antialiased;
    background: radial-gradient(900px 500px at 85% -10%, rgba(139,92,246,.10), transparent 60%), var(--bg); min-height: 100vh;
  }
  bdi, .ltr { unicode-bidi: isolate; direction: ltr; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* ---------- Layout: side tiles on desktop, bottom tab bar on phones ---------- */
  .app { min-height: 100vh; }
  .side { padding: 14px 16px 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .orb {
    width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 34% 30%, #fff 0, #e9ddff 8%, #b69cff 24%, #8B5CF6 48%, #4c1d95 78%, #1e0b44 100%);
    box-shadow: 0 0 18px 2px rgba(139,92,246,.55), 0 0 42px 6px rgba(139,92,246,.18), inset -3px -4px 8px rgba(0,0,0,.35);
  }
  .brand b { font-weight: 800; font-size: 17px; letter-spacing: .01em; display: block; }
  .brand b .dot { color: var(--accent2); font-weight: 700; }
  .brand b bdi { color: var(--accent2); letter-spacing: .08em; }
  .brand small { display: block; color: var(--muted); font-size: 11.5px; letter-spacing: .05em; font-weight: 600; margin-top: -2px; }

  .tiles {
    position: fixed; inset: auto 0 0 0; z-index: 30; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); background: rgba(9,10,19,.88);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line2);
  }
  .tile {
    appearance: none; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 6px 2px; border-radius: 12px; cursor: pointer; min-height: 54px; -webkit-tap-highlight-color: transparent;
    font-size: 11px; font-weight: 600; line-height: 1.15; position: relative; min-width: 0; text-align: center; overflow-wrap: anywhere;
  }
  .tile .ic { width: 32px; height: 28px; border-radius: 10px; display: grid; place-items: center; transition: .15s; }
  .tile .ic .ico { width: 19px; height: 19px; }
  .tile[aria-selected="true"] { color: #fff; }
  .tile[aria-selected="true"] .ic { background: var(--accent-soft); color: var(--accent2); box-shadow: inset 0 0 0 1px rgba(167,139,250,.35); }
  .tile:focus-visible { outline: 2px solid var(--accent2); outline-offset: 1px; }
  .badge {
    position: absolute; top: 3px; inset-inline-start: calc(50% + 8px);
    min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: #fff; box-shadow: 0 0 10px rgba(139,92,246,.6);
    font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; padding: 0 5px;
    font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate;
  }
  .badge.warn { background: var(--orange); color: var(--bg); box-shadow: 0 0 10px rgba(251,146,60,.6); }

  .main { padding: 10px 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)); max-width: 1180px; min-width: 0; }

  /* Top bar: search */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 0 12px;
    background: linear-gradient(var(--bg) 70%, rgba(7,8,15,0));
  }
  .search { flex: 1; position: relative; min-width: 0; }
  .search .ico { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--dim); width: 18px; height: 18px; pointer-events: none; }
  .search input {
    width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line2); background: var(--card); color: var(--text);
    font: inherit; font-size: 16px; padding-inline: 44px 14px; outline: none; transition: .15s; -webkit-appearance: none; appearance: none;
  }
  .search input::placeholder { color: var(--dim); }
  .search input:focus { border-color: rgba(167,139,250,.6); box-shadow: 0 0 0 4px rgba(139,92,246,.16); }
  .search input::-webkit-search-cancel-button { filter: invert(.6); }
  .upd { display: none; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .upd bdi { color: var(--text); }

  /* ---------- Cards ---------- */
  .card { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 20px; }
  .label { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 8px; }
  .label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex: none; }

  /* Hero: stars and purple glow, greeting by the hour, never a name */
  .hero {
    position: relative; overflow: hidden; padding: 26px 20px 22px;
    background: radial-gradient(420px 220px at 12% 0%, rgba(139,92,246,.22), transparent 70%),
                radial-gradient(300px 200px at 100% 110%, rgba(167,139,250,.10), transparent 70%),
                linear-gradient(180deg, #111427, #0c0e1b);
  }
  .hero::before, .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .hero::before {
    opacity: .9;
    background-image:
      radial-gradient(1.4px 1.4px at 8% 22%, #fff, transparent), radial-gradient(1px 1px at 16% 70%, #cfc3ff, transparent),
      radial-gradient(1.2px 1.2px at 24% 38%, #fff, transparent), radial-gradient(1px 1px at 31% 12%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 38% 58%, #e4dcff, transparent), radial-gradient(1px 1px at 44% 84%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 52% 26%, #fff, transparent), radial-gradient(1px 1px at 58% 66%, #bda9ff, transparent),
      radial-gradient(1.5px 1.5px at 64% 16%, #fff, transparent), radial-gradient(1px 1px at 70% 46%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 76% 80%, #fff, transparent), radial-gradient(1px 1px at 82% 30%, #d9ceff, transparent),
      radial-gradient(1.7px 1.7px at 88% 62%, #fff, transparent), radial-gradient(1px 1px at 93% 14%, #fff, transparent),
      radial-gradient(1px 1px at 97% 88%, #fff, transparent), radial-gradient(1.2px 1.2px at 5% 90%, #fff, transparent),
      radial-gradient(1px 1px at 48% 8%, #fff, transparent), radial-gradient(1px 1px at 67% 92%, #cbbcff, transparent);
    -webkit-mask-image: linear-gradient(90deg, #000, rgba(0,0,0,.35)); mask-image: linear-gradient(90deg, #000, rgba(0,0,0,.35));
  }
  /* A second, sparser layer twinkles. It stops when the system asks for less motion. */
  .hero::after {
    background-image:
      radial-gradient(1.6px 1.6px at 20% 30%, #fff, transparent), radial-gradient(1.3px 1.3px at 41% 72%, #e4dcff, transparent),
      radial-gradient(1.8px 1.8px at 61% 40%, #fff, transparent), radial-gradient(1.2px 1.2px at 79% 18%, #cfc3ff, transparent),
      radial-gradient(1.5px 1.5px at 91% 76%, #fff, transparent), radial-gradient(1.2px 1.2px at 12% 55%, #fff, transparent);
    animation: twinkle 4.8s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .95; } }
  .hero > * { position: relative; z-index: 1; }
  .date { font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--accent2); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .date::before { content: ""; width: 18px; height: 1px; background: currentColor; opacity: .6; }
  .hello { font-family: var(--serif); font-weight: 700; font-size: 36px; line-height: 1.1; margin: 0; letter-spacing: -.005em; }
  .hello em { font-style: normal; color: var(--accent2); text-shadow: 0 0 24px rgba(139,92,246,.45); }
  .prog { display: flex; align-items: center; gap: 12px; margin-top: 18px; max-width: 460px; }
  .bar { flex: 1; height: 8px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 99px; box-shadow: 0 0 12px rgba(139,92,246,.7); transition: width .35s ease; }
  .prog-count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .prog-count b { color: var(--text); font-weight: 700; }
  .upd-m { color: var(--dim); font-size: 12.5px; margin-top: 8px; }
  .upd-m bdi { color: var(--muted); }

  /* Stats: big number, faint 01-04 behind */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { position: relative; overflow: hidden; padding: 14px 16px; min-height: 108px; display: flex; flex-direction: column; }
  .stat .k { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
  .stat .v { font-size: 38px; font-weight: 800; line-height: 1; margin-top: auto; padding-top: 14px; color: var(--c, var(--text)); font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .stat .ghost {
    position: absolute; inset-inline-end: -6px; bottom: -22px; font-size: 92px; font-weight: 900; line-height: 1; color: rgba(255,255,255,.035);
    letter-spacing: -.04em; pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .stat.alert { border-color: rgba(139,92,246,.35); background: radial-gradient(200px 120px at 100% 0%, rgba(139,92,246,.18), transparent 70%), linear-gradient(180deg, var(--card2), var(--card)); }
  .stat .v, .stat .ghost { direction: ltr; unicode-bidi: isolate; text-align: right; }

  /* Search hides everything but the task list, like the tasks page */
  body.searching .hero, body.searching .stats, body.searching .wait-grid, body.searching .wait-empty,
  body.searching #belt-body > :not(.waiting), body.searching .waiting-head { display: none !important; }

  /* ---------- Panels and sections ---------- */
  .panel { display: flex; flex-direction: column; gap: 14px; }
  .dash { display: flex; flex-direction: column; gap: 14px; }
  #belt-body { display: flex; flex-direction: column; gap: 22px; margin-top: 8px; }
  h2.sec-title { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.2; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 2px 0; }
  .sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .hint { color: var(--muted); font-size: 14px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .count { color: var(--muted); font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.05); border-radius: 99px; padding: 3px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { color: var(--muted); margin: 0; }
  .alert-bar { background: rgba(251,146,60,.10); border: 1px solid rgba(251,146,60,.45); color: var(--orange); border-radius: 14px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }
  .ring {
    --c: var(--accent); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--c); flex: 0 0 auto;
    background: radial-gradient(circle, color-mix(in srgb, var(--c) 18%, transparent), color-mix(in srgb, var(--c) 6%, transparent) 70%);
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 70%, transparent), 0 0 18px -4px color-mix(in srgb, var(--c) 60%, transparent);
  }
  .ring .ico { width: 17px; height: 17px; }

  /* Robots */
  .robot { display: block; flex: none; overflow: visible; }
  .robot .bulb { transform-origin: 24px 5px; }
  .robot.busy .bulb { animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 0%, 60%, 100% { opacity: 1; } 75% { opacity: .25; } }
  .you {
    width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--accent);
    display: grid; place-items: center; box-shadow: 0 0 0 4px var(--accent-soft), 0 0 16px rgba(139,92,246,.55);
  }
  .you.done { background: var(--green); box-shadow: 0 0 12px rgba(52,211,153,.45); }

  /* Buttons and inputs */
  .btn {
    font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 12px; padding: 8px 16px;
    border: 1px solid var(--line2); background: var(--card3); color: var(--text); transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .btn:hover:not(:disabled) { border-color: rgba(167,139,250,.45); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 14px -2px rgba(139,92,246,.6); }
  .btn.ok { color: var(--green); border-color: rgba(52,211,153,.35); }
  .btn.no { color: var(--red); border-color: rgba(248,113,113,.35); }
  .btn.small { font-size: 13px; padding: 5px 12px; font-weight: 500; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
  textarea, input[type="text"], input[type="password"] {
    font: inherit; font-size: 16px; color: var(--text); background: var(--card); -webkit-appearance: none; appearance: none;
    border: 1px solid var(--line2); border-radius: 14px; padding: 10px 14px; width: 100%; resize: vertical; outline: none; transition: .15s;
  }
  textarea:focus, input[type="text"]:focus, input[type="password"]:focus { border-color: rgba(167,139,250,.6); box-shadow: 0 0 0 4px rgba(139,92,246,.16); }
  textarea::placeholder, input::placeholder { color: var(--dim); }
  .btn-note { font-size: 13px; color: var(--green); }
  .btn-note:empty { display: none; }
  .btn-note.warn { color: var(--orange); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* What waits for you */
  .waiting { display: flex; flex-direction: column; gap: 12px; }
  .waiting-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 2px 0; }
  .waiting-head .big { font-family: var(--serif); font-weight: 700; font-size: 34px; line-height: 1; color: var(--accent2); text-shadow: 0 0 24px rgba(139,92,246,.45); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  .waiting-head h2 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 24px; }
  .wait-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
  .wcard {
    background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 6px; text-align: right; min-width: 0; transition: border-color .15s, background .15s;
  }
  .wcard.appr { border-color: rgba(139,92,246,.35); background: radial-gradient(220px 120px at 100% 0%, rgba(139,92,246,.14), transparent 70%), linear-gradient(180deg, var(--card2), var(--card)); }
  button.wcard { cursor: pointer; }
  button.wcard:hover { border-color: var(--line2); background: linear-gradient(180deg, var(--card3), var(--card2)); }
  .wcard .kind { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--accent2); font-weight: 700; letter-spacing: .03em; }
  .wcard .title { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
  .wcard .detail { color: var(--muted); font-size: 14px; white-space: pre-wrap; margin: 0; overflow-wrap: anywhere; }
  .wcard.stale { border-color: rgba(251,146,60,.45); }
  .wcard.stale .kind { color: var(--orange); }
  .wcard .ep-line { display: flex; align-items: center; gap: 12px; }
  .wcard .ep-line .num { font-family: var(--serif); font-weight: 700; font-size: 30px; line-height: 1; color: var(--accent2); text-shadow: 0 0 18px rgba(139,92,246,.45); direction: ltr; unicode-bidi: isolate; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .approval-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .approval-actions input { flex: 1 1 100%; min-width: 0; font-size: 15px; padding: 7px 12px; border-radius: 12px; }
  .wait-empty { padding: 16px; color: var(--muted); margin: 0; }

  /* Your tasks: one list, checked only here */
  .ytasks { padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .3s, border-color .3s; }
  .ytasks.hot {
    border-color: rgba(139,92,246,.55);
    background: radial-gradient(360px 180px at 100% 0%, rgba(139,92,246,.24), transparent 70%), linear-gradient(180deg, #171430, #100f22);
    box-shadow: 0 0 0 1px rgba(139,92,246,.18), 0 18px 40px -18px rgba(139,92,246,.6);
  }
  .ytasks-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 2px; }
  .ytasks-head h3 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; }
  .ytasks-head .count { margin-inline-start: auto; }
  .ytasks-head .hint { flex-basis: 100%; font-size: 13.5px; }
  ul.ytask-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  label.ytask {
    display: flex; gap: 12px; align-items: flex-start; padding: 13px 12px; min-height: 54px; cursor: pointer; position: relative;
    border-radius: 14px; background: rgba(255,255,255,.028); border: 1px solid var(--line); -webkit-tap-highlight-color: transparent;
    transition: background .15s, border-color .15s;
  }
  label.ytask:hover { background: rgba(255,255,255,.045); border-color: var(--line2); }
  label.ytask input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .box { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 8px; border: 2px solid #444a66; display: grid; place-items: center; transition: .15s; margin-top: 1px; }
  .box svg { width: 16px; height: 16px; opacity: 0; transform: scale(.6); transition: .15s; }
  label.ytask input:checked + .box, label.task input:checked + .box { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px rgba(139,92,246,.6); }
  label.ytask input:checked + .box svg, label.task input:checked + .box svg { opacity: 1; transform: none; }
  label.ytask input:focus-visible + .box, label.task input:focus-visible + .box { outline: 3px solid rgba(139,92,246,.6); outline-offset: 2px; }
  label.ytask input:disabled + .box, label.task input:disabled + .box { opacity: .5; }
  .ytask-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .ytask-text { font-size: 16.5px; line-height: 1.45; overflow-wrap: anywhere; }
  .ytask-note { color: var(--muted); font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
  .ytask-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ytask-tags .tag { font-size: 11.5px; padding: 1px 8px; }
  .tag.src { color: var(--muted); }
  .tag.epno { color: var(--accent2); border-color: rgba(167,139,250,.35); }
  .urgent {
    display: block; width: fit-content; margin-bottom: 2px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: #fff;
    background: var(--accent); border-radius: 99px; padding: 2px 9px; box-shadow: 0 0 12px rgba(139,92,246,.6);
  }
  li.ytask-blocking label.ytask {
    border-color: rgba(139,92,246,.55);
    background: radial-gradient(260px 120px at 100% 0%, rgba(139,92,246,.20), transparent 70%), rgba(255,255,255,.028);
    box-shadow: 0 0 0 1px rgba(139,92,246,.18), 0 10px 26px -14px rgba(139,92,246,.7);
  }
  li.ytask-blocking .ytask-text { font-weight: 600; }

  /* The belt: stations flow right to left on wide screens, top to bottom on narrow ones */

      background: repeating-linear-gradient(180deg, rgba(167,139,250,.28) 0 8px, transparent 8px 14px); animation-name: roll-y; }

  details.fold { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; }

  .tag.waiting { color: var(--orange); border-color: rgba(251,146,60,.35); }
  .tag.picked { color: var(--accent2); border-color: rgba(167,139,250,.35); }

  /* Agents: one card per agent, Claude team then Grok team */
  .agent-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }

  .acard-top { display: flex; gap: 12px; align-items: center; min-width: 0; }

  /* Access key: one quiet line when saving is off, a masked field when opened */
  .keybar { padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; border-color: rgba(167,139,250,.30); }

  /* Episode sheet */
  .sheet-back { position: fixed; inset: 0; background: rgba(4,5,10,.82); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }

0"],["30-33","מול המצלמה: \"מה אתם רוצים שהוא ידע לעשות?\"","פנים. כתובית: מה הוא ילמד קודם?"]],"notes":["על מה: בניתי עוזר שכמעט עבד, והוא נכשל ברגע האמת. אז מחקתי הכל ואני מתחיל מאפס, והפעם מצלם.","מה הצופה לוקח: \"כמעט עובד\" זה לא עובד. ולפעמים עדיף להתחיל מחדש מאשר לתקן.","הגרסה שיצאה, 27.09.2026. הטקסט שהמשתמש הקליט ברצף אחד, לפי דף הקריינות בתיקיית הפרק. הניסוח שלו. רק קוצר.","ירדו מהטקסט המוקלט: \"ישבתי וחשבתי\", המטרה העיקרית, איך הוא נבנה, \"לצורך העניין, ניסיתי ללמד אותו\", ו\"החלטתי לפתח אותו מחדש\".","הסיום: שאלה לצופים, בלי המשפט החוזר. המשפט החוזר מתחיל מפרק 1.","רשת: אינסטגרם.","### החלטות 27.09.2026","הגרסה הסופית היא ייצוא/episode-00.mp4 בתיקיית הפרק. בתיקיית renders של הגרפיקה יש קובץ דומה, והוא לא הגרסה הסופית.","הפרק נערך קודם לפי התסריט הארוך, לא לפי הישן. בחומר הגלם הישן זה נשמע קרוא מדף, והאנרגיה נמוכה.","מהצילום של 23.09 נשארות רק הקלטות המסך. כל הפנים מצולמות מחדש.","סשן הצילום: קודם קוראים את התסריט בקול ומסמנים שורות שלא נשמעות טבעיות. אחר כך שיחה מול המצלמה: דף שאלות על מסך ליד המצלמה, עונים במילים שלי, כל שאלה כמה פעמים. בעמידה, אחרי חימום קצר.","בסשן הראשון רק קול ופנים. הקלטות המסך החסרות אחר כך.","מבחן: רצף קול בלבד. אם הסיפור עובד בשמיעה, ממשיכים לתמונה.","במסך החיוב הסכומים גלויים. מטושטשים רק השם ופרטי המשתמש. המשתמש החליט, 27.09.","הפרק נערך מחדש לגרסה של כ-33 שניות. הגרסה של 66 שניות הרגישה משעממת: יותר מדי סיפור על העבר מעל מסכים סטטיים. הארוכה שמורה בארכיון של תיקיית הגרפיקה.","מוזיקת רקע: קטע חופשי מפיקסביי, \"טכנולוגיה יצירתית\", לא רשום במערכת זיהוי זכויות. הרישיון שמור ליד הקובץ. נעצרת על \"לא קרה כלום\" וחוזרת עם העיגול הסגול.","הקריינות מוקלטת מחדש ברצף אחד מהטקסט הסופי, כי הרצף מתשובות נפרדות לא נשמע חלק. שוטי הפנים נשארים.","הגרפיקה מוכנה בתיקיית הגרפיקה של הפרק, ומוקפאת עד אחרי העריכה: כתוביות פתיחה, \"לא ביקשתי ריוורב\", שעון המתנה, עיגול וחשיפת לוגו, שאלת הסיום ושער.","סבב הערות של המשתמש, 27.09 בערב. הגרסה הסופית בתיקיית הייצוא היא בדיוק הטיוטה שהמשתמש שמע ואישר. הגרסה הקודמת והפרויקט שלפני השינוי שמורים בארכיון העריכה, בתיקייה v33-before-sfx.","אפקטים קוליים מספרייה חינמית, ברישיון נחלת הכלל. קובץ רישיון ליד כל אפקט בתיקיית הסאונדים של הפרק. כל מכה נכנסת לשקט בקריינות, אף אחת לא על מילה. בלוגו אין צליל.","השעון: צליל סוחף עולה מתחת לקול משנייה 8.7, תקתוקים בין המילים, ובאזר של תשובה לא נכונה ב-12.8, יחד עם עצירת המוזיקה. השעון נעצר על 4:37 והנקודה מאדימה. צליל השגיאה שונה מצליל החתימה, ולא סוגר את השאלה \"מה נשמע כשהוא תקוע\".","צליל הדלקה לעיגול הסגול בשנייה 21. המשתמש אישר.","כתוביות: שורה אחת, גדולות יותר, בלי רקע, קו מתאר שחור וצל, ומילה אחת בסגול בכל כתובית. בפתיחה רק כתוביות הפתיחה. בחשיפת הלוגו הכתובית ממורכזת.","שאלת הסיום מציגה את מה שנאמר: \"מה אתם רוצים שהוא ידע לעשות?\"","שורת המשימות, עם התאריך והשעה, מטושטשת בשלושה מקומות.","השם הישן של אב הטיפוס לא מופיע בפרק. המשתמש צפה ואישר.","פטיש העביר את הפרק בסבב השני. בחשיפת הלוגו הכתוביות עלו מהאזור שאינסטגרם מכסה: \"תכירו את ניפו\" בגובה של שאר הכתוביות, ו\"העוזר האישי שלי\" בין העיגול לשם, כי מתחת לתווית \"פרק 00\" אין מקום. מני הכריע. השמע הוא בדיוק השמע של הטיוטה שהמשתמש אישר."],"tasks":[{"id":"e0-rec-1","cat":"rec","text":"חלונות של צ'אט נסגרים אחד אחרי השני","done":true},{"id":"e0-rec-2","cat":"rec","text":"מסך חיוב או שימוש של שירות AI","done":true},{"id":"e0-rec-3","cat":"rec","text":"קריינות: כל שורה כמה פעמים, בניסוחים שונים","done":true},{"id":"e0-shoot-1","cat":"shoot","text":"פנים: \"ישבתי וחשבתי, איזה מגניב זה שיהיה לי עוזר משלי\"","done":true},{"id":"e0-shoot-2","cat":"shoot","text":"פנים: \"אבל אני לא מסתפק רק בזה\"","done":true},{"id":"e0-shoot-3","cat":"shoot","text":"ידיים על המקלדת","done":true},{"id":"e0-shoot-4","cat":"shoot","text":"פנים: \"תכירו את NIPO. העוזר האישי שלי. מה אתם רוצים שהוא ידע לעשות?\"","done":true},{"id":"e0-prep-1","cat":"prep","text":"המשתמש מספר את הפרק במילים שלו","done":true},{"id":"e0-prep-2","cat":"prep","text":"לכתוב את הסיום במילים של המשתמש","done":true},{"id":"e0-edit-1","cat":"edit","text":"רצף קול בלבד, עד שהסיפור עובד בשמיעה","done":true},{"id":"e0-edit-2","cat":" "ממה בכלל בנוי עוזר AI? גם אני לא ידעתי.\"","דף לבן ריק על הקיר. יד עם טוש נכנסת לפריים"],["3-7","\"אז ביקשתי מה-AI להסביר לי. מא' ועד ת'.\"","פנים"],["7-11","\"קודם כל, הוא צריך לשמוע אותי.\"","מצייר אוזן, כותב: שומע"],["11-15","\"ואז לחשוב. זה המוח. מחשב קטן, שעוד לא הזמנתי.\"","מצייר ריבוע, כותב: חושב. סימן שאלה לידו"],["15-19","\"ואז לענות לי. בקול. בעברית.\"","מצייר פה, כותב: עונה. חץ מ\"חושב\""],["19-23","\"הוא צריך לראות את הידיים שלי...\"","מצייר עין, כותב: רואה ידיים"],["23-27","\"...להופיע על הקיר הזה...\"","מצביע על הקיר סביב הדף, כותב: מופיע על הקיר"],["27-31","\"...ולהזיז יד. יד אמיתית. וזה החלק שהכי מפחיד אותי.\"","מצייר זרוע, כותב: זז. חיתוך לפנים"],["31-36","\"והמוח שלו אמור לגור אצלי בבית. לא אצל אף אחד אחר.\"","מתרחקים: המפה המלאה על הקיר"],["36-45","\"אפס ידע. אפס קוד. עוזר AI שהוא רק שלי. מאיזה חלק אתם הייתם מתחילים?\"","פנים ליד המפה. כתובית: מאיזה חלק מתחילים?"]],"notes":["על מה: ציירתי על הקיר את המפה של העוזר: שומע, חושב, עונה, רואה, מופיע על הקיר וזז.","מה הצופה לוקח: עוזר כזה הוא לא קסם אחד. הוא כמה חלקים פשוטים שמחוברים יחד.","> תסריט ישן, לפי הכללים הישנים. נשאר כחומר עזר עד שייכתב תסריט חדש. לא למחוק.","מצלמים על דף גדול שתלוי על הקיר הריק, הקיר ש-NIPO יוקרן עליו. מציירים בטוש שחור בזמן שמדברים, ובעריכה מאיצים.","הטוש הסגול שמור לפרקים הבאים: כל יכולת שמתחילה לעבוד מסומנת בסגול. המפה נשארת על הקיר כל העונה.","אם הפרק ארוך מדי, יורד ראשון המשפט על הפחד מהיד.","\"גר אצלי בבית\" מנוסח כמטרה (\"אמור\"), כי עוד לא נבדק.","המפה הזו חוזרת בגמר: אני מסביר אותה לבד, בלי עזרה. לשמור את הדף.","לוודא לפני צילום: שהמפה באמת נבנתה משיחה עם ה-AI.","באותו סשן: לצלם את הקיר הריק ואת השולחן הריק, תמונות ה\"לפני\" של העונה.","### שאלות לסיפור","עונים במילים שלך, כמו שהיית מספר לחבר. אין תשובה לא נכונה, ומותר לענות כמה פעמים.","1. אם היו לך שלוש שניות לתפוס מישהו שגולל, מה היית אומר לו על הפרק הזה?","2. לפני שהתחלת, מה חשבת שיש בתוך עוזר כזה? מה לא ידעת?","3. איך התחילה השיחה עם ה-AI? מה שאלת אותו, בערך במילים שלך?","4. איך מהשיחה הזאת יצאה המפה? מה הוא הציע, ומה אתה הוספת או שינית?","5. מה הפתיע אותך כשראית את כל החלקים ביחד?","6. איזה חלק הכי מפחיד אותך, ולמה דווקא הוא?","7. למה דווקא הקיר הזה? מה אתה רואה כשאתה מסתכל עליו ריק?","8. כשהמפה תלויה על הקיר, מה השתנה אצלך לעומת היום שבו התחלת?","9. מה היית רוצה לשאול את מי שצופה בסוף?"],"tasks":[{"id":"e2-prep-1","cat":"prep","text":"המשתמש מספר את הפרק במילים שלו","done":false},{"id":"e2-prep-2","cat":"prep","text":"דף גדול, טוש שחור וטוש סגול","done":false},{"id":"e2-prep-3","cat":"prep","text":"לתלות את הדף על הקיר הריק","done":false},{"id":"e2-prep-4","cat":"prep","text":"לוודא שהמפה באמת נבנתה משיחה עם ה-AI","done":false},{"id":"e2-shoot-1","cat":"shoot","text":"הקיר הריק והשולחן הריק, לפני שתולים את הדף","done":false},{"id":"e2-shoot-2","cat":"shoot","text":"ציור המפה בזמן הדיבור, שוט לכל שורה","done":false},{"id":"e2-shoot-3","cat":"shoot","text":"פנים: \"אז ביקשתי מה-AI להסביר לי\"","done":false},{"id":"e2-shoot-4","cat":"shoot","text":"שוט רחב של המפה המלאה","done":false},{"id":"e2-shoot-5","cat":"shoot","text":"פנים ליד המפה: השאלה לצופים","done":false},{"id":"e2-edit-1","cat":"edit","text":"להאיץ את הציור","done":false},{"id":"e2-edit-2","cat":"edit","text":"ארבע הבדיקות לפני ייצוא","done":false},{"id":"e2-post-1","cat":"post","text":"שער: הרובוט עם מוח סגול. אושר 28.09","done":true},{"id":"e2-post-2","cat":"post","text":"כיתוב לפוסט","done":false},{"id":"e2-dev-1","cat":"dev","text":"NIPO שומע ועונה בקול, בעברית, עם המיקרופון והרמקול הקיימים. המוח בבית, בלי תלות במוח חיצוני","done":false}],"duration":"כ-45 שניות","captions":"ממה בנוי / עוזר AI? / גם אני לא ידעתי","cover":"הרובוט המצויר בטוש עם מוח סגול, \"אני בונה עוזר AI\", פרק 2. אושר 28.09, בדרייב","caption":"ממה בנוי עוזר AI? ציירתי את זה על הקיר שהוא יגור עליו. כל חלק שיתחיל לעבוד יסומן בסגול. מאיזה חלק אתם הייתם מתחילים? #NIPO #AI #בינה_מלאכותית","status":{"script":{"state":"progress","label":"נבנה מחדש"},"shot":{"state":"todo","label":""},"edited":{"state":"todo","label":""},"posted":{"state":"todo","label":""}},"stage":"story"},{"id":"3","title":"שלחתי לו הודעה. הוא ענה.","rows":[["0-3","קריינות: \"שלחתי לו הודעה. והוא ענה.\" (הצעה, מחכה לסיפור)","הטלפון, התראה מ-NIPO. צליל חתימה"],["3-8","קריינות: \"אבל כשהתחלתי, היה לו רק בית. בלי כלים.\" (הצעה, מחכה לסיפור)","הבית של הפרויקט מסוף פרק 1, מהצילום של 23.09: קבצי תכנון, עוד בלי כלים ובלי בוט"],["8-15","קריינות: הבעיה: מה נתקע בהתקנת הכלים ובבוט. מהיומן","המסך"],["15-30","קריינות: התיקון בשלושה שוטים: ה-AI מתקין, הבוט נבנה, ההודעה הראשונה נשלחת","הקלטת מסך מהסשנים, מואצת. שנייה או שתיים: הקבצים שמורים בענן, שמות הקבצים בעברית ואין בהם מידע אישי"],["30-42","קריינות: התוצאה: שולח לו הודעה בטלפון, והוא עונה. בשלב הזה זה בוט בסיסי, עוד בלי מוח. מה בדיוק הוא עונה - מהיומן","הטלפון ביד, בלי חיתוך"],["42-50","מול המצלמה: \"אפס ידע. אפס קוד. עוזר AI שהוא רק שלי.\" ואז \"מה הייתם כותבים לו ראשון?\" (השאלה: הצעה, מחכה לסיפור)","פנים"]],"notes":["על מה: התקנתי לו כלים, ושלחתי לו הודעה ראשונה. והוא ענה.","מה הצופה לוקח: גם בלי לדעת מה מתקינים, אפשר להגיע לעוזר שעונה לך בטלפון.","שלד. משימות 1.1 ו-1.2 בתוכנית: הכנת הסביבה ובוט בטלגרם. לפי יומן הפיתוח, הסשן של 23.09 צולם: נפתח בו הבית של הפרויקט, והוא חולק לשני סוכנים. התקנת כלים לא מופיעה בו, אז את ההתקנה מצלמים כשהיא קורית.","אם נתקע: \"שלחתי לו הודעה. שעה. שום דבר.\" (הצעה, מחכה לסיפור)","בלי טבעת. הודעה כתובה היא לא דיבור. הטבעת \"עונה\" מחכה לפרק הקול.","לפני שמתכננים את שוט ההתקנה: לבדוק עם קודי מה עוד נשאר להתקין. משימה 1.1 עדיין בעבודה.","התוצאה: לפי תוכנית העבודה, בשלב הזה הבוט בסיסי, והמוח מגיע רק בפרק 5. אם התשובה באה ממוח חיצוני, זה מתנגש בקו העצמאות. לברר עם קודי לפני הצילום.","לצנזר: מספר טלפון, שם משתמש, אנשי קשר, מפתח הגישה של הבוט, נתיבים עם שם המשתמש, שם החשבון והמאגר בענן, מייל, וכתובת אתר המשימות אם הוא נכנס לשוט.","הקבצים בעברית ובלי מידע אישי, וזה בכוונה. מראים את זה בשוט הקבצים בענן.","רעיון לשוט: אתר המשימות הזה. גם אותו אף אחד לא כתב בקוד."],"tasks":[{"id":"e3-prep-1","cat":"prep","text":"המשתמש מספר את הפרק במילים שלו","done":false},{"id":"e3-prep-2", // Writes one file: applies change() to the latest content and commits it with the last sha.
// On a sha conflict, reads again and reapplies only this change, up to MAX_RETRIES times.
async function writeFile(name, change, message) {
  if (!REPO) throw new GhError(0, "local");
  if (!token) throw new GhError(0, "nokey");
  if (tokenBad) throw new GhError(0, "badkey");
  inFlight[name] = (inFlight[name] || 0) + 1;
  gen[name] = (gen[name] || 0) + 1;
  try {
    let cur = store[name]?.sha ? store[name] : await readApi(name);
    for (let attempt = 0; ; attempt++) {
      const next = change(JSON.parse(JSON.stringify(cur.data)));
      const body = { message, content: b64encode(JSON.stringify(next, null, 2) + "\n") };
      if (cur.sha) body.sha = cur.sha;
      const res = await fetch(apiUrl(name), {
        method: "PUT", cache: "no-store",
        headers: { ...apiHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        const j = await res.json();
        store[name] = { data: next, sha: j?.content?.sha || null };
        applyFile(name);
        return next;
      }
      const err = await ghFail(res);
      if (err.kind === "conflict" && attempt < MAX_RETRIES) { cur = await readApi(name); continue; }
      throw err;
    }

}

          const w = waitsForYou(e);
          const flag = [
            nA ? `${nA} לאישור` : "",
            eT.length ? (eT.length === 1 ? "משימה אחת" : `${eT.length} משימות`) + (eT.some(t => t.blocking) ? ", עוצרת" : "") : "",
          ].filter(Boolean).join(" · ") || (w ? "מחכה לך" : "");
          return `<button class="ep ${w ? "wait" : ""}" data-ep="${esc(e.id)}" aria-label="${esc(epLabel(e))}: ${esc(e.title)}${flag ? ". " + flag : ""}">

        }).join("") : `<span class="st-idle">ריק</span>`}</div>

    <ul class="plain">${m.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></details>` : "";

  paint(document.getElementById("belt-body"), waiting + belt + decidedForYou() + morning);
}

async function sendRequest(to, text, noteKey) {
  text = text.trim();
  if (!canWrite() || !text) return false;
  const createdAt = new Date().toISOString();
  const id = newId();
  unsaved.add(createdAt);
  setBtnNote(noteKey, "שולח…");
  // Show it at once, marked unsaved, until the commit lands.
  requests = [{ id, to, text, status: "waiting", createdAt, _pending: true }, ...requests];
  renderRequests();
  try {
    await updateDoc("requests", id, d => {
      if (d) throw new GhError(0, "other");
      return { to, text, status: "waiting", createdAt };
    }, `Add request for ${to}`);
    unsaved.delete(createdAt);
    setBtnNote(noteKey, `נשלחה ל${nameOf(to)}.${isGrok(to) ? " מני מעביר בשיחה הבאה." : ""}`);
    renderRequests();
    return true;
  } catch (err) {
    unsaved.delete(createdAt);
    requests = requests.filter(r => r.id !== id);
    setBtnNote(noteKey, saveError(err, "ההוראה לא נשמרה. נסה שוב בעוד רגע."), true);
    renderRequests();
    return false;
  }
}

function renderDash() {
  const set = (id, v) => { const el = document.getElementById(id); if (el.textContent !== String(v)) el.textContent = v; };
  const ready = loaded.tasks;
  const open = openTasks();
  set("st-open", ready ? open.length : "–");
  set("st-block", ready ? open.filter(t => t.blocking).length : "–");
  set("st-appr", loaded.approvals ? pendingApprovals().length : "–");
  set("st-eps", episodes.filter(e => stageOf(e) !== "posted").length);
  // Progress: tasks done this week out of this week's done plus what is still open.
  const weekDone = tasks.filter(t => t.status === "done" && t.doneAt && Date.now() - new Date(t.doneAt) <= DONE_SHOWN_MS).length;
  const total = weekDone + open.length;
  const pct = ready && total ? Math.round(weekDone / total * 100) : 0;
  document.getElementById("bar-fill").style.width = pct + "%";
  const bar = document.getElementById("bar");
  bar.setAttribute("aria-valuenow", pct);
  document.getElementById("prog-count").innerHTML = !ready ? (loadFailed ? "המשימות לא נטענו" : "טוען משימות…")
    : `<bdi dir="ltr"><b>${weekDone}</b>/${total}</bdi> משימות בוצעו השבוע`;
}
const GREETINGS = [[5, 12, "בוקר", "טוב"], [12, 17, "צהריים", "טובים"], [17, 22, "ערב", "טוב"]];
function paintClock() {
  const now = new Date();
  const p = Object.fromEntries(new Intl.DateTimeFormat("he-IL", { weekday: "long", day: "numeric", month: "long" })
    .formatToParts(now).map(x => [x.type, x.value]));
  document.getElementById("date").innerHTML = `${esc(p.weekday)} · <bdi dir="ltr">${esc(p.day)}</bdi> ${esc(p.month)}`;
  const h = now.getHours();
  const [, , a, b] = GREETINGS.find(([from, to]) => h >= from && h < to) || [0, 0, "לילה", "טוב"];
  document.getElementById("greet").innerHTML = `${a} <em>${b}</em>`;
}
function applySearch() {
  const next = document.getElementById("q").value.trim().toLowerCase();
  document.body.classList.toggle("searching", !!next);
  if (next === query) return;
  query = next;
  if (query && document.getElementById("view-belt").hidden) selectView("belt");
  renderBelt();
}
function renderAll() {
  renderKeyBar();
  renderBelt();
  renderRequests();
  renderDev();
  renderAgents();
  renderBadges();
  if (openEp) renderSheet();
}

/* ---------- Events ---------- */
document.addEventListener("change", ev => {
  const taskId = ev.target?.dataset?.task;
  if (taskId && ev.target.matches('input[type="checkbox"]')) { setTaskDone(taskId, ev.target.checked); return; }
  const id = ev.target?.dataset?.id;
  if (!id || !ev.target.matches('input[type="checkbox"]') || !canSaveChecks()) return;
  saveCheck(id, ev.target.checked);
});

document.addEventListener("click", async ev => {
  const t = ev.target;
  if (t.id === "sheet-back" || t.closest("[data-close]")) { closeSheet(); return; }
  const nav = t.closest('.tiles [role="tab"]');
  if (nav) { selectView(nav.id.slice(4)); return; }
  if (t.closest("[data-key-open]")) { keyOpen = true; renderKeyBar(); return; }
  if (t.closest("[data-key-close]")) { keyOpen = false; delete btnNotes.key; renderKeyBar(); return; }
  if (t.closest("[data-key-remove]")) { removeKey(); return; }
  const go = t.closest("[data-go]");
  if (go) { selectView(go.dataset.go); return; }
  const ep = t.closest("[data-ep]");
  if (ep) { openSheet(ep.dataset.ep); return; }
  const to = t.closest("[data-to]");
  if (to) { composeTo = to.dataset.to; renderRequests(); return; }
  const cancel = t.closest("[data-cancel]");
  if (cancel && canWrite()) {
    const id = cancel.dataset.cancel;
    const key = "cancel-" + id;
    cancel.disabled = true;
    setBtnNote(key, "שומר…");
    try {
      await updateDoc("requests", id, d => {
        d = mustExist(d);
        // Only a waiting instruction can be cancelled; once picked, the agent owns it.
        if (d.status !== "waiting") throw new GhError(0, "taken");
        return { ...d, status: "cancelled", cancelledAt: new Date().toISOString() };
      }, `Cancel request ${id}`);
      setBtnNote(key, "");
      setNote("ההוראה בוטלה.");
      renderRequests(); renderBelt(); renderBadges();
    } catch (err) {
      cancel.disabled = false;
      setBtnNote(key, err?.kind === "taken" ? "הסוכן כבר אסף את ההוראה, אז אי אפשר לבטל אותה."
        : saveError(err, "הביטול לא נשמר. נסה שוב."), true);
      if (err?.kind === "taken") refresh(true);
    }
    return;
  }
  const decide = t.closest("[data-decide]");
  if (decide && canWrite()) {
    const id = decide.dataset.id;
    const key = "appr-" + id;
    const status = decide.dataset.decide;
    const note = document.getElementById(`note-in-${decide.dataset.where}-${id}`)?.value.trim() || "";
    const btns = decide.closest(".approval-actions").querySelectorAll("button");
    btns.forEach(b => b.disabled = true);
    setBtnNote(key, "שומר…");
    try {
      const decidedAt = new Date().toISOString();
      await updateDoc("approvals", id, d => ({ ...mustExist(d), status, decidedAt, note }),
        `${status === "approved" ? "Approve" : "Reject"} ${id}`);
      delete btnNotes[key];
      setNote(status === "approved" ? "אושר. הסוכן ימשיך בשיחה הבאה." : "נדחה. הסוכן יראה את זה בשיחה הבאה.");
      renderBelt(); renderBadges();
      if (openEp) renderSheet();
    } catch (err) {
      btns.forEach(b => b.disabled = false);
      setBtnNote(key, saveError(err, "ההחלטה לא נשמרה. נסה שוב."), true);
    }
    return;
  }
  const obj = t.closest("[data-object]");
  if (obj && canWrite()) {
    const id = obj.dataset.object;
    const d = grokDecisions.find(x => x.id === id);
    if (!d || d.objected) return;
    const key = "object-" + id;
    obj.disabled = true;
    // The instruction to Meni goes first, so an objection is never marked without reaching him.
    if (!await sendRequest("meni", `מתנגד להחלטה שדווחה בשמי: ${d.text}`, key)) { obj.disabled = false; return; }
    try {
      const objectedAt = new Date().toISOString();
      await updateDoc("grokDecisions", id, x => ({ ...mustExist(x), objected: true, objectedAt }), `Object to decision ${id}`);
      setBtnNote(key, "");
      setNote("ההתנגדות נשלחה למני.");
      renderBelt();
    } catch (err) {
      setBtnNote(key, saveError(err, "ההתנגדות נשלחה למני, אבל הסימון לא נשמר."), true);
    }
    return;
  }
});

document.addEventListener("submit", async ev => {
  ev.preventDefault();
  if (ev.target.id === "key-form") {
    const box = document.getElementById("key-in");
    const v = box.value;
    box.value = "";
    await saveKey(v);
    return;
  }
  if (ev.target.id === "compose-form") {
    const box = document.getElementById("compose-text");
    const btn = document.getElementById("compose-send");
    if (!box.value.trim()) { setBtnNote("compose", "אין מה לשלוח. כתוב קודם הוראה.", true); return; }
    btn.disabled = true;
    if (await sendRequest(composeTo, box.value, "compose")) document.getElementById("compose-text").value = "";
    document.getElementById("compose-send").disabled = !canWrite();
  }
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && openEp) { closeSheet(); return; }
});

/* ---------- Shoot checks (data/checks.json, { items }) ---------- */
const canSaveChecks = () => canWrite() && loaded.checks;
async function saveCheck(id, done) {
  const item = { done, at: new Date().toISOString() };
  const before = checks[id];
  checks[id] = item;
  if (openEp) renderSheet();
  try {
    await writeFile("checks", data => {
      data.items = data.items || {};
      data.items[id] = item;
      return data;
    }, `Update shoot check ${id}`);
    setNote("נשמר.");
  } catch (err) {
    if (before) checks[id] = before; else delete checks[id];
    if (openEp) renderSheet();
    setNote(saveError(err, "הסימון לא נשמר. נסה שוב בעוד רגע."), true);
  }
}

/* ---------- Boot ---------- */
paintStatus();
document.querySelectorAll(".built-at").forEach(el => { el.textContent = fmtDate(DATA.builtAt); });
paintClock();
setInterval(paintClock, 60 * 1000);
document.getElementById("q").addEventListener("input", applySearch);
renderAll();
{
  let start = "belt";
  const hash = location.hash.slice(1);
  if (VIEWS.includes(hash)) start = hash;
  else { try { const s = localStorage.getItem("nipo-view2"); if (VIEWS.includes(s)) start = s; } catch (e) {} }
  selectView(start);
}
// Stale marks depend on the clock, so refresh them every few minutes.
setInterval(() => { renderBelt(); renderRequests(); renderAgents(); renderBadges(); }, 5 * 60 * 1000);
// Live data: read now, every minute while the tab is visible, and whenever it comes back.
refresh(true);
setInterval(() => { if (!document.hidden) refresh(true); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
window.addEventListener("focus", () => refresh());
</script>
